<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>วิเคราะห์ผล ปพ.5 / ปพ.6</title>
  <meta name="description" content="อัปโหลดไฟล์ ปพ.5 แต่ละวิชา แล้วดูคะแนนตามตัวชี้วัดและเกรดรายบุคคล">
  <meta name="theme-color" content="#1767ee">
  <link rel="icon" type="image/png" href="../favicon.png?v=2">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="public.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="home" href="../" title="กลับหน้าแอปห้องเรียน">‹</a>
      <div class="brand">
        <h1>ระบบ ปพ.5 / ปพ.6 โรงเรียนวัดทุ่งแฝก</h1>
        <p id="schoolLine">อัปโหลดไฟล์ ปพ.5 ของแต่ละวิชา แล้วดูผลรายบุคคล</p>
      </div>
      <div class="top-acts" id="topActs"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="picker card">
      <div class="field">
        <label for="yearSel">ปีการศึกษา</label>
        <select id="yearSel"></select>
      </div>
      <div class="field grow">
        <label for="classSel">ชั้นเรียน</label>
        <select id="classSel" class="big-sel"></select>
      </div>
      <div class="field">
        <button class="btn pri up-btn" id="upBtn" type="button" title="เลือกไฟล์ ปพ.5 / ปพ.6 / รายชื่อ (.docx) ได้หลายไฟล์ หรือลากไฟล์มาวางที่ใดก็ได้บนหน้านี้">⇪ อัปโหลดไฟล์</button>
        <input type="file" id="fileAll" accept=".xlsm,.xlsx,.xls,.docx" multiple hidden>
      </div>
    </section>

    <section id="rosterBar"></section>

    <nav class="tabs" role="tablist">
      <button data-tab="subjects" role="tab">รายวิชา</button>
      <button data-tab="summary" role="tab">สรุปทั้งห้อง</button>
      <button data-tab="student" role="tab">รายบุคคล</button>
      <button data-tab="report" role="tab">ใบรายงาน ปพ.6</button>
      <button data-tab="publish" role="tab">ประกาศผล</button>
    </nav>

    <section id="view"></section>

    <p class="privacy">ไฟล์และคะแนนเก็บไว้ในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่ได้ส่งขึ้นอินเทอร์เน็ต ระบบเก็บเฉพาะเลขบัตรประชาชน 4 ตัวท้าย (ใช้ยืนยันตัวตนผู้ปกครอง)
      · <button class="link" id="clearAll">ล้างข้อมูลทั้งหมด</button></p>
  </main>

  <dialog id="modal">
    <div class="modal-h">
      <h2 id="modalTitle"></h2>
      <button class="x" id="modalClose" aria-label="ปิด">×</button>
    </div>
    <div id="modalBody"></div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileOne" accept=".xlsm,.xlsx,.xls" hidden>
  <input type="file" id="fileRoster" accept=".docx" hidden>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="parser.js"></script>
  <script src="pp6parser.js"></script>
  <script src="model.js"></script>
  <script src="xlsxfill.js"></script>
  <script src="templates.js"></script>
  <script src="roster.js"></script>
  <script src="pinpad.js"></script>
  <script src="teachers.js"></script>
  <script src="library.js"></script>
  <script src="grid.js"></script>
  <script src="editor.js"></script>
  <script src="public.js"></script>
  <script src="publish.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
