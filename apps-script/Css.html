<style>
:root {
  --brand: #1767ee;
  --brand-d: #0f4fc2;
  --brand-l: #e8f0ff;
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #17233a;
  --muted: #5d6b82;
  --line: #dde4ef;
  --ok: #138a4e;
  --ok-l: #e3f6ec;
  --warn: #b26a00;
  --warn-l: #fff3dc;
  --bad: #c62f3a;
  --bad-l: #fde8ea;
  --g4: #0f8a4f; --g35: #2f9e5d; --g3: #4a9f2f; --g25: #8a9a12; --g2: #b88300; --g15: #cf6a10; --g1: #d24b1c; --g0: #c62f3a;
  --radius: 14px;
  --shadow: 0 1px 2px #17233a0f, 0 4px 14px #17233a0d;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Sarabun", system-ui, -apple-system, "Segoe UI", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: 16px; line-height: 1.5;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- ส่วนหัว ---------- */
.top { background: linear-gradient(120deg, #1557d8, #1f86f8); color: #fff; padding-top: env(safe-area-inset-top); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.home { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: #ffffff22; flex: none; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; }
.brand p { margin: 0; font-size: 14px; color: #dbe8ff; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ---------- ตัวเลือกปี/ชั้น/ห้อง ---------- */
.picker { display: flex; flex-wrap: wrap; gap: 12px 18px; padding: 12px 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 260px; }
.field label, .field .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
select { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 10px; min-width: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 600; position: relative; }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip .dot { position: absolute; top: 2px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.chip.on .dot { background: #fff; }

/* ---------- ช่องวางไฟล์ ---------- */
.drop {
  margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center;
  padding: 16px 18px; border: 2px dashed #9fbaf0; border-radius: var(--radius); background: var(--brand-l); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.drop:hover, .drop.over { background: #d8e6ff; border-color: var(--brand); }
.drop-ic { grid-row: span 2; font-size: 30px; color: var(--brand); width: 48px; height: 48px; display: grid; place-items: center; background: #fff; border-radius: 12px; }
.drop-t { font-size: 16px; }
.drop-s { font-size: 13px; color: var(--muted); }
body.dragging .drop { border-color: var(--brand); background: #d8e6ff; }

/* ---------- แท็บ ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }

h2.sec { font-size: 18px; margin: 4px 0 10px; }
.sub { color: var(--muted); font-size: 14px; margin: -6px 0 12px; }

/* ---------- ช่องรายวิชา ---------- */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.slot { padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; position: relative; }
.slot.empty { border-style: dashed; background: #fbfcfe; box-shadow: none; cursor: pointer; }
.slot.empty:hover, .slot.over { border-color: var(--brand); background: var(--brand-l); }
.slot-h { display: flex; gap: 10px; align-items: center; }
.slot-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; color: #fff; }
.slot-n { font-weight: 700; line-height: 1.3; }
.slot-c { font-size: 13px; color: var(--muted); }
.slot-f { font-size: 12.5px; color: var(--muted); word-break: break-all; background: var(--bg); border-radius: 8px; padding: 4px 8px; }
.slot-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.slot-empty-t { color: var(--muted); font-size: 14px; margin-top: auto; }
.slot-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 5px 11px; font-size: 14px; font-weight: 600; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-d); color: #fff; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.link { border: 0; background: none; color: var(--brand); padding: 0; text-decoration: underline; font-size: inherit; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-l); color: var(--ok); }
.badge.warn { background: var(--warn-l); color: var(--warn); }
.badge.bad { background: var(--bad-l); color: var(--bad); }
.badge.mute { background: var(--bg); color: var(--muted); }

/* ---------- ตาราง ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { background: #f6f8fc; font-weight: 600; color: #34425a; position: sticky; top: 0; z-index: 1; }
td.l, th.l { text-align: left; }
td.wrap-t { white-space: normal; min-width: 220px; text-align: left; }
tbody tr:hover { background: #f8fbff; }
tr.click { cursor: pointer; }
.stick { position: sticky; left: 0; background: #fff; z-index: 2; }
th.stick { background: #f6f8fc; z-index: 3; }
tfoot td { background: #f6f8fc; font-weight: 600; }
.grp { background: var(--brand-l) !important; color: var(--brand-d); }

.g { display: inline-block; min-width: 38px; padding: 1px 8px; border-radius: 8px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.g-4 { background: var(--g4); } .g-35 { background: var(--g35); } .g-3 { background: var(--g3); } .g-25 { background: var(--g25); }
.g-2 { background: var(--g2); } .g-15 { background: var(--g15); } .g-1 { background: var(--g1); } .g-0 { background: var(--g0); }
.g-x { background: var(--warn-l); color: var(--warn); }
.g-none { background: none; color: #a3adbd; font-weight: 400; }

.bar { display: inline-block; vertical-align: middle; width: 80px; height: 8px; border-radius: 99px; background: #e6ebf3; overflow: hidden; margin-left: 6px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.bar.low i { background: var(--bad); }
.bar.mid i { background: #e1a100; }
.empty-cell { color: #b5bdcb; }

/* ---------- ไทล์สรุป ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { padding: 12px 14px; }
.tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }

/* ---------- รายบุคคล ---------- */
.stu-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.stu-bar select { flex: 1 1 240px; max-width: 420px; }
.profile { padding: 16px; display: flex; flex-wrap: wrap; gap: 6px 26px; margin-bottom: 14px; align-items: center; }
.profile .nm { font-size: 22px; font-weight: 700; flex-basis: 100%; }
.profile .it { font-size: 14.5px; color: var(--muted); }
.profile .it b { color: var(--ink); font-weight: 600; }
.subj { margin-bottom: 10px; overflow: hidden; }
.subj > summary { list-style: none; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; cursor: pointer; }
.subj > summary::-webkit-details-marker { display: none; }
.subj > summary::before { content: "›"; font-size: 22px; line-height: 1; color: var(--muted); transition: transform .15s; }
.subj[open] > summary::before { transform: rotate(90deg); }
.subj .t { font-weight: 700; flex: 1 1 220px; }
.subj .t small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.subj-body { padding: 0 14px 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 10px 0; }
.kv div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.kv b { display: block; font-size: 17px; }
.note { font-size: 13.5px; color: var(--warn); background: var(--warn-l); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; }

.empty-state { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-state b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

.dist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 14px; }
.dist .card { padding: 12px 14px; }
.dist h3 { font-size: 15px; margin: 0 0 8px; }
.hbar { display: grid; grid-template-columns: 34px 1fr 28px; gap: 6px; align-items: center; font-size: 13px; margin: 2px 0; }
.hbar .tr { height: 12px; background: #eef2f8; border-radius: 99px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; border-radius: 99px; }

.privacy { font-size: 13px; color: var(--muted); text-align: center; margin-top: 26px; }

/* ---------- หน้าต่าง ---------- */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(1100px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 20px 60px #0b1a3a55; }
dialog::backdrop { background: #0b1a3a77; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 5; }
.modal-h h2 { font-size: 17px; margin: 0; flex: 1; }
.x { border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; }
#modalBody { padding: 14px 16px 18px; }
#modalBody .tbl-wrap { max-height: 64vh; }

/* ---------- แจ้งเตือน ---------- */
#toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(520px, calc(100vw - 32px)); }
.toast { background: #17233a; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; box-shadow: 0 8px 24px #0005; animation: tin .2s ease; }
.toast.ok { border-left: 5px solid #3ccf86; }
.toast.err { border-left: 5px solid #ff6b75; }
.toast.info { border-left: 5px solid #6aa5ff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

.busy { position: fixed; inset: 0; background: #ffffffaa; display: none; place-items: center; z-index: 60; font-weight: 600; }
.busy.on { display: grid; }

@media (max-width: 600px) {
  .brand h1 { font-size: 18px; }
  .tile .v { font-size: 22px; }
  table { font-size: 13.5px; }
  th, td { padding: 6px 7px; }
  .profile .nm { font-size: 19px; }
}

/* ---------- พิมพ์รายงาน ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; font-size: 13px; }
  .top, .picker, .drop, .tabs, .privacy, .stu-bar, #toasts, .no-print { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .card { box-shadow: none; }
  .subj { break-inside: avoid; }
  .subj-body { display: block !important; }
  .tbl-wrap { overflow: visible; border: 0; }
  th { position: static; }
  .print-only { display: block !important; }
  .g, .bar i, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.print-only { display: none; }

/* ---------- กรอก ปพ. ในระบบ ---------- */
.ed-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; margin-bottom: 12px; position: sticky; top: 0; z-index: 20; }
.ed-t b { display: block; font-size: 17px; }
.ed-t span { font-size: 13.5px; color: var(--muted); }
.ed-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.ed-acts .btn { padding: 8px 14px; }
.ed-tabs { margin-bottom: 10px; }
.ed-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; padding: 16px; }
.ed-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ed-f.wide { grid-column: 1 / -1; }
.ed-f span { font-size: 13px; color: var(--muted); font-weight: 600; }
.ed-f input, .ed-f select { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 15px; background: #fff; width: 100%; }
.ed-f input:focus, .ed-f select:focus { outline: 2px solid #1767ee55; border-color: var(--brand); }
.ed-f input:disabled { background: var(--bg); color: var(--muted); }
.ed-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 14px; }
.ed-mini { width: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; }
.g-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
.g-tbl { border-collapse: separate; border-spacing: 0; font-size: 14px; width: max-content; min-width: 100%; }
.g-tbl th, .g-tbl td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
.g-tbl thead th { position: sticky; top: 0; background: #f2f5fa; z-index: 3; padding: 5px 6px; font-weight: 600; font-size: 13px; text-align: center; line-height: 1.2; white-space: normal; vertical-align: bottom; }
.g-tbl thead tr:nth-child(2) th { top: 27px; }
.g-tbl thead th small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; max-width: 120px; margin: 0 auto; }
.g-tbl th.g-grp { background: var(--brand-l); color: var(--brand-d); }
.g-tbl .g-rh { position: sticky; left: 0; background: #f8fafd; z-index: 2; text-align: left; padding: 4px 8px; font-weight: 500; min-width: 54px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.g-tbl thead .g-rh { z-index: 4; }
.g-name { font-size: 13.5px; }
.g-in input, .g-in select { width: 100%; border: 0; background: transparent; padding: 6px 6px; font-size: 14px; font-variant-numeric: tabular-nums; min-height: 32px; }
.g-in input:focus, .g-in select:focus { outline: 2px solid var(--brand); outline-offset: -2px; background: #fff; }
.g-in:hover { background: #f7faff; }
.g-bad { background: var(--bad-l) !important; }
.g-bad input { color: var(--bad); font-weight: 700; }
.g-ro { background: #f6f8fb; color: #2b3954; padding: 6px 8px !important; text-align: center; font-variant-numeric: tabular-nums; }
.g-strong { font-weight: 700; color: var(--ink); }
.g-fill { display: block; margin: 3px auto 0; font-size: 11.5px; padding: 1px 2px; border-radius: 6px; border: 1px solid var(--line); max-width: 100%; min-width: 0; }
.rc-yt { border-collapse: collapse; font-size: 14.5px; }
.rc-yt th, .rc-yt td { border-bottom: 1px solid var(--line); padding: 6px 14px; text-align: left; }
.pub-preview { min-height: 0; background: #eef3fb; border-radius: var(--radius); padding: 14px; }

/* ---------- แม่แบบรูปแบบต้นฉบับ ---------- */
.tpl-card { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; margin-bottom: 14px; }
.tpl-it { display: inline-block; margin: 0 10px 0 6px; font-size: 14.5px; color: var(--muted); }
.tpl-it.ok { color: var(--ok); font-weight: 600; }
.tpl-it small { font-weight: 400; color: var(--muted); }

/* ---------- ทะเบียนรายชื่อนักเรียน ---------- */
.roster-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-top: 12px; border-left: 4px solid var(--ok); }
.roster-bar.empty { border-left-color: var(--warn); color: var(--muted); }
.rb-t b { display: block; font-size: 15px; }
.rb-t span { font-size: 13.5px; color: var(--muted); }
.rb-a { display: flex; flex-wrap: wrap; gap: 6px; }

/* ===== หน้าตาแบบง่าย ===== */
.top-acts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.top-acts .tb { background: #ffffff22; color: #fff; border: 1px solid #ffffff55; border-radius: 999px; padding: 6px 12px; font: 500 14px "Sarabun", sans-serif; cursor: pointer; }
.top-acts .tb:hover { background: #ffffff3a; }
.top-acts .role { font-size: 13px; color: #dbe8ff; }
.big-sel { min-width: 220px; font-size: 17px; padding: 9px 10px; }
.up-btn { padding: 10px 18px; font-size: 16px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brand); }
.btn.ghost:hover { background: #eef4ff; }
body.dragging::after { content: "วางไฟล์ที่นี่เพื่ออัปโหลด"; position: fixed; inset: 10px; border: 3px dashed var(--brand); border-radius: 18px; background: #e8f0ffd9; display: grid; place-items: center; font: 600 22px "Prompt", sans-serif; color: var(--brand); z-index: 50; pointer-events: none; }
.flag-list { display: grid; gap: 8px; margin: 8px 0 14px; }
.flag-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line, #e2e8f0); border-radius: 12px; background: #fff; }
.flag-row b { font-weight: 600; }
.sw { position: relative; width: 52px; height: 30px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw span { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .15s; cursor: pointer; }
.sw span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 3px #0003; }
.sw input:checked + span { background: #16a34a; }
.sw input:checked + span::before { transform: translateX(22px); }
.flag-off-note { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; font-size: 14px; }
@media (max-width: 640px) { .top-in { flex-wrap: wrap; } .top-acts { width: 100%; justify-content: flex-start; } .big-sel { min-width: 0; width: 100%; } }

/* ===== แท็บ + แบนเนอร์บอกว่ากำลังทำอะไรอยู่ ===== */
.tabs { gap: 8px; border-bottom: 0; padding: 4px 0 2px; }
.tabs button { --tc: var(--brand); display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 14px; color: #334155; font-size: 15px; border-bottom-width: 1.5px; }
.tabs button .ti { font-size: 17px; }
.tabs button:hover { border-color: var(--tc); color: var(--tc); }
.tabs button.on { background: var(--tc); border-color: var(--tc); color: #fff; box-shadow: 0 4px 14px -6px var(--tc); }
.bnr { --bc: var(--brand); display: flex; align-items: center; gap: 14px; margin: 8px 0 16px; padding: 14px 18px; border-radius: 16px; color: #fff; background: linear-gradient(120deg, var(--bc), color-mix(in srgb, var(--bc) 70%, #000)); box-shadow: 0 10px 24px -14px var(--bc); }
.bnr .bi { font-size: 34px; line-height: 1; width: 52px; height: 52px; display: grid; place-items: center; background: #ffffff26; border-radius: 14px; flex: none; }
.bnr .bk { font-size: 13px; opacity: .85; letter-spacing: .3px; }
.bnr .bt { font: 700 21px "Prompt", "Sarabun", sans-serif; margin: 1px 0; }
.bnr .bs { font-size: 14px; opacity: .9; }
.bnr .bx { margin-left: auto; text-align: right; font-size: 13px; opacity: .95; }
.bnr .bx b { display: block; font: 700 20px "Prompt", sans-serif; }
@media (max-width: 640px) { .bnr { padding: 12px; gap: 10px; } .bnr .bi { width: 42px; height: 42px; font-size: 26px; } .bnr .bt { font-size: 18px; } .bnr .bx { display: none; } .tabs button { padding: 8px 10px; font-size: 14px; } }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.chk-it { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
.chk-it.ok { border-color: #b7e4c7; background: #f0fbf4; }
.chk-it.bad { border-color: #fed7aa; background: #fff8f1; }
.chk-h { margin-bottom: 4px; }
.chk-t { font-size: 14px; color: #475569; }
.chk-list { margin: 6px 0 0; padding-left: 18px; font-size: 14px; max-height: 240px; overflow: auto; }
.chk-list li.bad { color: #b45309; }

/* ===== ระบบผู้ดูแล (แอดมิน) ===== */
.sup-top { background: linear-gradient(120deg, #7f1d1d, #450a0a) !important; }
.sup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
.sup-card { padding: 16px 18px; margin-bottom: 14px; }
.sup-card h2 { margin: 0 0 4px; font: 600 19px "Prompt", sans-serif; }
.sup-h3 { margin: 12px 0 2px; font-size: 15px; color: #7f1d1d; }
.sup-list { margin: 8px 0 12px; padding-left: 18px; }
.sup-list li { margin: 3px 0; }
.muted { color: #94a3b8; }

.top-acts a.tb { text-decoration: none; }
.top-acts .home-tb { background: #fff; color: #1d4ed8; border-color: #fff; font-weight: 700; }
.sup-top .top-acts .home-tb { color: #7f1d1d; }
.top-acts .home-tb:hover { background: #e0e7ff; }

.sup-brand { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 8px 0 12px; }
.sup-person input { width: 100%; margin: 4px 0; }
.sup-pic { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.sup-pic-box { width: 100%; height: 110px; border: 1px dashed #cbd5e1; border-radius: 12px; display: grid; place-items: center; background: repeating-conic-gradient(#f8fafc 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
.sup-pic-box img { max-width: 92%; max-height: 100px; }
.sup-sigs { display: flex; flex-wrap: wrap; gap: 10px; }
.sup-sig { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: center; background: #fff; }
.sup-sig img { display: block; height: 46px; max-width: 160px; margin: 0 auto 2px; }
.rc-locked { background: #f8fafc; }
.rc-lock-n { font-weight: 600; margin: 4px 0 0; }

/* ปุ่มเลือกห้อง */
.cls-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; margin-top: 4px; }
.cls-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cls-lv { font: 600 13px "Prompt", sans-serif; color: #64748b; width: 30px; }
.cls-b { position: relative; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 12px; font: 600 15px "Sarabun", sans-serif; color: #334155; cursor: pointer; min-width: 68px; }
.cls-b:hover { border-color: var(--brand); color: var(--brand); }
.cls-b.has { border-color: #86efac; background: #f0fdf4; }
.cls-b.on { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px -6px var(--brand); }
.cls-b i { position: absolute; top: -7px; right: -6px; background: #16a34a; color: #fff; font: 700 11px/18px sans-serif; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; font-style: normal; }
.cls-b.on i { background: #fff; color: var(--brand); }
@media (max-width: 640px) { .cls-chips { grid-template-columns: 1fr; } .cls-b { min-width: 0; padding: 7px 10px; font-size: 14px; } }
/* ส่วนพิมพ์/ดาวน์โหลด */
.rc-print-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 6px 0 10px; }
.rc-pbox { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fbfcfe; }
.rc-pt { font: 600 17px "Prompt", sans-serif; }
.rc-pt span { font: 500 14px "Sarabun", sans-serif; color: #64748b; margin-left: 6px; }
.btn.big { padding: 11px 14px; font-size: 16px; text-align: center; justify-content: center; width: 100%; }
.rc-pick { display: flex; gap: 6px; }
.rc-pick select { flex: 1; min-width: 0; font-size: 15px; }
.rc-opts { border-top: 1px dashed var(--line); padding-top: 10px; }
.rc-lock { color: #64748b; display: block; margin-top: 4px; }
.rc-signers .rc-sig-pick { min-height: 72px; display: flex; align-items: center; }
.rc-signers .rc-sig-pick img { height: 64px; max-width: 100%; object-fit: contain; border: 0; background: transparent; }

.ed-empty-ind { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 10px 14px; margin: 0 0 10px; color: #9a3412; }

/* ===== หน้ากรอก ปพ.: ขั้นตอน + โหมดกรอกทีละช่อง ===== */
.ed-steps { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 6px; scrollbar-width: thin; }
.ed-steps button { flex: none; display: flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px 7px 7px; font: 600 14.5px "Sarabun", sans-serif; color: #334155; cursor: pointer; }
.ed-steps button i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #eef2f7; font: 700 12.5px "Prompt", sans-serif; }
.ed-steps button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.ed-steps button.on i { background: #fff; color: var(--brand); }
.ed-mode { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0 12px; }
.ed-mode span { font-size: 13px; color: var(--muted); margin-right: 2px; }
.ed-mode button { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 7px 12px; font: 600 14px "Sarabun", sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
.ed-mode button small { font-weight: 400; font-size: 11.5px; color: var(--muted); }
.ed-mode button.on { border-color: var(--brand); background: #eef4ff; color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }

.qk { display: flex; flex-direction: column; gap: 10px; }
.qk-cols { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; align-items: stretch; scrollbar-width: thin; }
.qk-g { flex: none; align-self: center; font: 600 12px "Prompt", sans-serif; color: #64748b; padding: 0 4px 0 8px; border-left: 2px solid var(--line); white-space: nowrap; }
.qk-g:first-child { border-left: 0; padding-left: 0; }
.qk-c { flex: none; min-width: 74px; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-family: "Sarabun", sans-serif; }
.qk-c b { font-size: 14px; white-space: nowrap; }
.qk-c small { font-size: 11px; color: #64748b; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qk-c i { font-style: normal; font-size: 11px; color: #b45309; background: #fff7ed; border-radius: 999px; padding: 0 6px; margin-top: 2px; }
.qk-c.done i { color: #15803d; background: #dcfce7; }
.qk-c.on { border-color: var(--brand); background: var(--brand); color: #fff; }
.qk-c.on small { color: #dbeafe; }
.qk-head { display: flex; align-items: center; gap: 10px; background: linear-gradient(120deg, #1d5bd8, #1e40af); color: #fff; border-radius: 16px; padding: 10px 12px; position: sticky; top: 74px; z-index: 5; box-shadow: 0 8px 18px -12px #1e40af; }
.qk-t { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; }
.qk-t b { font: 700 19px "Prompt", sans-serif; }
.qk-t b span { font: 500 15px "Sarabun", sans-serif; opacity: .85; }
.qk-t small { font-size: 12.5px; opacity: .85; }
.qk-nav { width: 44px; height: 44px; border-radius: 12px; border: 0; background: #ffffff26; color: #fff; font-size: 24px; cursor: pointer; flex: none; }
.qk-nav:disabled { opacity: .3; cursor: default; }
.qk-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.qk-tools .btn { font-size: 13.5px; padding: 6px 10px; }
.qk-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
.qk-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #eef2f7; }
.qk-row:first-child { border-top: 0; }
.qk-row:nth-child(even) { background: #fafbfd; }
.qk-who { flex: 1; min-width: 0; }
.qk-who .g-name { font-weight: 600; font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qk-sum { display: flex; gap: 10px; font-size: 12px; color: #64748b; flex-wrap: wrap; }
.qk-sum b { color: #0f172a; }
.qk-btns { display: flex; gap: 5px; flex: none; }
.qk-b { min-width: 42px; height: 42px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; font: 700 16px "Prompt", sans-serif; color: #334155; cursor: pointer; padding: 0 8px; }
.qk-b.on { background: #16a34a; border-color: #16a34a; color: #fff; }
.qk-b.clr { min-width: 34px; color: #94a3b8; font-weight: 400; }
.qk-inp { display: flex; gap: 5px; flex: none; }
.qk-i { width: 84px; height: 44px; font: 700 20px "Prompt", sans-serif; text-align: center; border: 1.5px solid var(--line); border-radius: 11px; }
.qk-i:focus { border-color: var(--brand); outline: 3px solid #bfdbfe; }
.qk-i.over { border-color: #dc2626; background: #fef2f2; color: #b91c1c; }
.qk-full { height: 44px; border-radius: 11px; border: 1.5px solid #bbf7d0; background: #f0fdf4; color: #15803d; font: 600 13px "Sarabun", sans-serif; padding: 0 10px; cursor: pointer; }
.qk-next { align-self: center; padding: 12px 22px; font-size: 16px; }
@media (max-width: 640px) {
  .qk-row { flex-wrap: wrap; gap: 6px; padding: 9px 10px; }
  .qk-who { flex-basis: 100%; }
  .qk-btns, .qk-inp { width: 100%; }
  .qk-b { flex: 1; height: 46px; }
  .qk-b.clr { flex: 0 0 40px; }
  .qk-i { flex: 1; width: auto; }
  .qk-head { top: 6px; }
  .ed-bar { position: static; padding: 10px 12px; }
  .ed-bar .ed-t b { font-size: 15.5px; }
  .ed-bar .ed-acts { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ed-bar .ed-acts .btn { font-size: 13.5px; padding: 8px; }
  /* ปุ่มบันทึกลอยด้านล่างจอ กดได้ตลอด */
  .ed-bar .ed-acts .btn.pri { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40; padding: 14px; font-size: 17px; border-radius: 14px; box-shadow: 0 10px 24px -8px #1d4ed8; }
  .ed-steps + .ed-mode, #edBody { padding-bottom: 0; }
  #edBody { margin-bottom: 76px; }
}

@media (max-width: 640px) {
  .cls-chips { grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .cls-lv { width: 26px; }
  /* ระหว่างกรอก ปพ. บนมือถือ: ซ่อนส่วนเลือกห้อง/แท็บ ให้เห็นช่องกรอกเต็มจอ */
  body.editing .picker, body.editing #rosterBar, body.editing .tabs:not(.ed-tabs), body.editing .privacy { display: none; }
  .bnr { margin: 4px 0 10px; }
  .bnr .bs { display: none; }
  .bnr .bt { font-size: 16px; }
  .bnr .bi { width: 38px; height: 38px; font-size: 22px; border-radius: 10px; }
}

/* หน้าจอโหลดตอนเข้าสู่ระบบ */
.boot { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: linear-gradient(135deg, #1b3fae, #3b82f6); color: #fff; transition: opacity .35s; font-family: "Sarabun", sans-serif; }
.boot.done { opacity: 0; pointer-events: none; }
.sup-page .boot { background: linear-gradient(135deg, #7f1d1d, #b91c1c); }
.boot .pp-load-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.boot .pp-load-box b { font: 600 20px "Prompt", "Sarabun", sans-serif; }
.boot .pp-load-box small { opacity: .8; }
.boot .pp-spin { width: 58px; height: 58px; border-radius: 50%; border: 6px solid #ffffff44; border-top-color: #fff; animation: bootspin .8s linear infinite; }
@keyframes bootspin { to { transform: rotate(360deg); } }
.old-year { border-color: #f59e0b !important; background: #fffbeb !important; }
.old-note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fffbeb; border: 1.5px solid #f59e0b; color: #92400e; border-radius: 12px; padding: 8px 12px; margin: 8px 0 0; }
.old-note .btn { margin-left: auto; }

/* ===== ประวัติผลการเรียนรายคน (ครู/แอดมิน) ===== */
.hs-card { margin-top: 14px; }
.hs-q { display: flex; gap: 8px; margin: 6px 0 10px; }
.hs-q input { flex: 1; max-width: 260px; font-size: 16px; }
.hs-who { margin: 6px 0; } .hs-who span { color: var(--muted); font-size: 14px; margin-left: 6px; }
.hs-tl { display: flex; flex-direction: column; gap: 6px; }
.hs-y { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: #fff; }
.hs-y.miss { background: #fffbeb; border-color: #fde68a; }
.hs-yt { min-width: 170px; } .hs-yt b { display: block; } .hs-yt span { font-size: 13px; color: var(--muted); }
.hs-ya { margin-left: auto; display: flex; gap: 6px; }
.badge.info { background: #e0f2fe; color: #075985; }
.hs-f { margin: 4px 0 10px; padding: 12px; background: #f8fafc; }
.hs-fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.hs-fg label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 3px; }
.hs-fg label.w2 { grid-column: span 2; }
.hs-subs { margin: 10px 0; display: flex; flex-direction: column; gap: 5px; }
.hs-s { display: grid; grid-template-columns: 1fr 90px 90px; gap: 6px; }
@media (max-width: 560px) { .hs-fg label.w2 { grid-column: auto; } }
.sup-files { display: flex; flex-direction: column; gap: 10px; }
.sup-fy > a { text-decoration: none; }
.sup-fc { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 0 10px; }
.sup-cls { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sup-cls > a { min-width: 60px; text-decoration: none; }
.sup-cls .chip { text-decoration: none; font-size: 13px; }

/* ---------- แผงควบคุมใบรายงาน ---------- */
.rc-panel { padding: 14px 16px; margin-bottom: 14px; }
.rc-panel h3 { margin: 0 0 10px; font-size: 16px; }
.rc-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.rc-opt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rc-opt > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--brand); color: #fff; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; }
.rc-signers { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
.rc-signers .card { padding: 10px 12px; box-shadow: none; display: grid; gap: 6px; }
.rc-signers b { font-size: 13.5px; }
.rc-signers input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 100%; font-size: 14px; }
.rc-sig-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rc-sig-pick img { height: 34px; max-width: 110px; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.rc-sig-pick select { min-width: 0; flex: 1; }
.rc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rc-actions .btn { padding: 8px 14px; }
.rc-progress { margin-top: 10px; height: 8px; border-radius: 99px; background: #e6ebf3; overflow: hidden; display: none; }
.rc-progress.on { display: block; }
.rc-progress i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .2s; }
.rc-ptext { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }

.rc-preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
.rc-preview-bar select { flex: 1 1 220px; max-width: 380px; }
.rc-preview { display: flex; flex-direction: column; align-items: center; gap: 16px; background: #dfe5ee; border-radius: var(--radius); padding: 16px 8px; overflow: hidden; }
.rc-scale { transform-origin: top left; }
.rc-fit { overflow: hidden; box-shadow: 0 4px 18px #17233a33; background: #fff; flex: none; }

/* ---------- หน้ากระดาษใบรายงาน (ออกแบบที่ A4 แนวตั้ง) ---------- */
.rc-page {
  width: 210mm; height: 297mm; padding: 11mm 13mm 10mm; background: #fff; color: #111;
  font-family: "Sarabun", "TH Sarabun New", "Leelawadee UI", Tahoma, sans-serif;
  font-size: 11.5pt; line-height: 1.32; position: relative; overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.rc-page * { box-sizing: border-box; }
.rc-page h4 { font-size: 12.5pt; margin: 3.5mm 0 1.5mm; font-weight: 700; }
.rc-head { text-align: center; position: relative; }
.rc-logo { height: 25mm; display: block; margin: 0 auto 1mm; }
.rc-title { font-size: 16pt; font-weight: 700; margin: 0; }
.rc-tag { position: absolute; right: 0; top: 0; border: 1.2px solid #111; border-radius: 2mm; padding: 0.5mm 3mm; font-weight: 700; font-size: 13pt; }
.rc-sub { font-size: 12pt; }
.rc-who { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6mm; font-size: 12.5pt; margin-top: 1mm; }
.rc-who b { font-weight: 700; }
.rc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5mm 5mm; }
.rc-t { width: 100%; border-collapse: collapse; font-size: 11pt; }
.rc-t th, .rc-t td { border: 0.8px solid #333; padding: 0.9mm 1.6mm; text-align: center; white-space: normal; position: static; background: none; color: #111; }
.rc-t th { background: #eef1f6; font-weight: 700; line-height: 1.2; }
.rc-t td.l, .rc-t th.l { text-align: left; }
.rc-t tr.grp td { background: #f5f6f8; font-weight: 700; text-align: left; }
.rc-t tr.sum td { font-weight: 700; }
.rc-t small { font-weight: 400; font-size: 9.5pt; }
.rc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
.rc-box { border: 0.8px solid #333; padding: 2mm 3mm; min-height: 18mm; }
.rc-dots { border-bottom: 1px dotted #555; height: 7.5mm; }
.rc-sign { text-align: center; margin-top: 3mm; font-size: 11.5pt; line-height: 1.35; }
.rc-sign .sig { height: 13mm; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -4mm; position: relative; z-index: 1; }
.rc-sign .sig img { max-height: 15mm; max-width: 45mm; object-fit: contain; }
.rc-sign .ln { white-space: nowrap; }
.rc-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: auto; }
.rc-cb { display: inline-block; width: 3.6mm; height: 3.6mm; border: 1px solid #111; vertical-align: -0.5mm; margin-right: 1.4mm; position: relative; background: #fff; }
.rc-cb.on::after { content: ""; position: absolute; left: 0.9mm; top: -0.6mm; width: 1.2mm; height: 2.6mm; border: solid #111; border-width: 0 0.55mm 0.55mm 0; transform: rotate(45deg); }
.rc-sumlist { display: grid; gap: 2mm; font-size: 12pt; }
.rc-sumlist .it { display: grid; grid-template-columns: 7mm 1fr; }
.rc-sumlist .opts { display: flex; flex-wrap: wrap; gap: 0.5mm 8mm; margin-top: 0.5mm; }
.rc-page .op { white-space: nowrap; display: inline-block; margin-right: 6mm; }
.rc-sumlist .op, .rc-verdict .op { margin-right: 0; }
.rc-dense { font-size: 10.5pt; line-height: 1.25; }
.rc-dense .rc-t { font-size: 10pt; }
.rc-dense .rc-t th, .rc-dense .rc-t td { padding: 0.55mm 1.4mm; }
.rc-dense h4 { margin: 2.6mm 0 1.2mm; font-size: 11.5pt; }
.rc-dense .rc-sign { margin-top: 1mm; }

/* ---------- พื้นที่ซ่อนสำหรับถ่ายภาพหน้าเป็น PDF ---------- */
#rcStage { position: fixed; left: -12000px; top: 0; width: 210mm; background: #fff; z-index: -1; }

/* ---------- พิมพ์ผ่านเบราว์เซอร์ ---------- */
#rcPrint { display: none; }
@media print {
  body.rc-printing > *:not(#rcPrint) { display: none !important; }
  body.rc-printing #rcPrint { display: block; }
  body.rc-printing { background: #fff; }
  #rcPrint .sheet { break-after: page; page-break-after: always; overflow: hidden; position: relative; }
  #rcPrint .sheet:last-child { break-after: auto; page-break-after: auto; }
  #rcPrint .sheet.a4 { width: 210mm; height: 296mm; }
  #rcPrint .sheet.half { width: 297mm; height: 209mm; display: flex; }
  #rcPrint .sheet.half .slot { width: 148.5mm; height: 209mm; overflow: hidden; position: relative; }
  #rcPrint .sheet.half .slot + .slot { border-left: 0.3mm dashed #999; }
  #rcPrint .sheet.half .slot > .rc-page { transform: scale(0.7071); transform-origin: top left; }
  #rcPrint .rc-page, #rcPrint .rc-t th, #rcPrint .rc-t tr.grp td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- หน้าประกาศผลสำหรับผู้ปกครอง ---------- */
.pub-page {
  --p1: #1b3fae; --p2: #2f6df6; --p3: #6aa8ff; --gold: #f5b82e; --ink: #14213d; --mut: #5f6c86; --line: #e3e8f2; --bg: #f4f7fc;
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: "Sarabun", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; font-size: 16px; line-height: 1.55;
}
.pub-page * { box-sizing: border-box; }
.pub-page h1, .pub-page h2, .pub-page h3, .pub-hero-t, .pub-who .nm, .pub-tile .v { font-family: "Prompt", "Sarabun", system-ui, sans-serif; }
.pub-hero {
  position: relative; overflow: hidden; color: #fff; text-align: center;
  padding: calc(34px + env(safe-area-inset-top)) 16px 120px;
  background: radial-gradient(1200px 500px at 85% -10%, #4f8dff55, transparent 60%), radial-gradient(900px 500px at 0% 110%, #f5b82e33, transparent 60%), linear-gradient(135deg, var(--p1), var(--p2) 60%, #3b82f6);
}
.pub-hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#ffffff22 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(#000, transparent 85%); pointer-events: none; }
.pub-hero > * { position: relative; z-index: 1; }
.pub-logo { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 8px 18px #0b1f5c66); margin-bottom: 8px; }
.pub-kicker { display: inline-block; font-size: 13.5px; letter-spacing: .3px; background: #ffffff22; border: 1px solid #ffffff33; padding: 4px 14px; border-radius: 999px; margin-bottom: 10px; }
.pub-hero-t { font-size: clamp(28px, 6vw, 44px); font-weight: 700; margin: 0; line-height: 1.2; text-shadow: 0 4px 24px #0b1f5c55; }
.pub-school { font-size: clamp(16px, 3.6vw, 20px); color: #dbe7ff; margin-top: 6px; }
.pub-status { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.pub-chip { background: #ffffff1f; border: 1px solid #ffffff38; border-radius: 999px; padding: 3px 12px; font-size: 13.5px; }
.pub-chip::before { content: "●"; color: #7CFFB2; margin-right: 6px; font-size: 10px; vertical-align: 2px; }

.pub-main { max-width: 860px; margin: -88px auto 0; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); position: relative; z-index: 2; }
.pub-card { background: #fff; border-radius: 22px; box-shadow: 0 1px 2px #14213d0d, 0 18px 50px #1b3fae1f; border: 1px solid #ffffffaa; }
.pub-search { padding: 26px 24px 22px; }
.pub-search h2 { margin: 0 0 4px; font-size: 21px; }
.pub-search p { margin: 0 0 16px; color: var(--mut); font-size: 15px; }
.pub-ann { background: #fff8e6; border: 1px solid #f7dd9a; color: #7a5300; border-radius: 14px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px; white-space: pre-line; }
.pub-fields { display: grid; grid-template-columns: 1fr; gap: 12px; }
.pub-fields.two { grid-template-columns: 1.4fr 1fr; }
.pub-field label { display: block; font-size: 14px; font-weight: 600; color: var(--mut); margin-bottom: 6px; }
.pub-field input {
  width: 100%; font: inherit; font-size: 22px; letter-spacing: 2px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line);
  background: #f8faff; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; font-variant-numeric: tabular-nums;
}
.pub-field input:focus { border-color: var(--p2); box-shadow: 0 0 0 4px #2f6df622; background: #fff; }
.pub-btn {
  font: inherit; font-weight: 700; font-size: 18px; border: 0; border-radius: 14px; padding: 14px 22px; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, var(--p2), var(--p1)); box-shadow: 0 8px 20px #2f6df644; transition: transform .1s, box-shadow .15s;
}
.pub-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px #2f6df655; }
.pub-btn:disabled { opacity: .7; cursor: wait; }
.pub-btn.busy::after { content: ""; display: inline-block; width: 16px; height: 16px; border: 2.5px solid #fff; border-right-color: transparent; border-radius: 50%; margin-left: 10px; vertical-align: -2px; animation: pubspin .7s linear infinite; }
@keyframes pubspin { to { transform: rotate(360deg); } }
.pub-btn.wide { width: 100%; margin-top: 16px; }
.pub-btn.ghost { background: #fff; color: var(--p1); border: 1.5px solid var(--line); box-shadow: none; font-size: 15px; padding: 10px 16px; }
.pub-err { margin-top: 12px; background: #fdecee; color: #b4232f; border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.pub-help { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 18px; }
.pub-help div { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: 14.5px; color: var(--mut); }
.pub-help b { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 2px; }
.pub-help .ic { font-size: 22px; }

.pub-student { display: flex; align-items: center; gap: 16px; padding: 18px 20px; flex-wrap: wrap; }
.pub-av { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--gold), #f08c1c); flex: none; font-family: "Prompt", sans-serif; }
.pub-who { flex: 1 1 220px; min-width: 0; }
.pub-who .nm { font-size: 22px; font-weight: 600; line-height: 1.25; }
.pub-who .meta { color: var(--mut); font-size: 14.5px; }
.pub-yr, .pub-year { font: inherit; font-weight: 600; color: var(--p1); background: #eef3ff; border: 0; border-radius: 12px; padding: 8px 12px; }
.pub-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #e7edf9; border-radius: 18px; padding: 6px; margin: 14px 0; }
.pub-seg button { font: inherit; border: 0; background: none; border-radius: 14px; padding: 10px 8px; font-weight: 700; font-size: 16.5px; color: var(--mut); cursor: pointer; line-height: 1.25; }
.pub-seg button small { display: block; font-weight: 400; font-size: 12.5px; }
.pub-seg button.on { background: #fff; color: var(--p1); box-shadow: 0 4px 14px #1b3fae22; }
.pub-body { padding: 18px; }
.pub-note { color: var(--mut); font-size: 14.5px; margin: 0 0 12px; }
.pub-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-bottom: 14px; }
.pub-tile { background: var(--bg); border-radius: 16px; padding: 12px 14px; }
.pub-tile .k { font-size: 13.5px; color: var(--mut); font-weight: 600; }
.pub-tile .v { font-size: 28px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pub-tile .v small { font-size: 15px; color: var(--mut); font-weight: 500; }
.pub-tile .s { font-size: 13px; color: var(--mut); margin-top: 2px; }
.pub-tile.pub-hl { background: linear-gradient(135deg, #2f6df6, #1b3fae); color: #fff; }

.pub-tile.pub-ok { background: #e4f7ec; } .pub-tile.pub-ok .v { color: #11804a; font-size: 22px; }
.pub-tile.pub-bad { background: #fdecee; } .pub-tile.pub-bad .v { color: #b4232f; font-size: 22px; }
.pub-tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; -webkit-overflow-scrolling: touch; }
.pub-tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.pub-tbl th { background: #f6f8fd; color: #3b4863; font-weight: 600; padding: 10px; text-align: center; white-space: nowrap; font-size: 14px; }
.pub-tbl th small { display: block; font-weight: 400; font-size: 12px; color: var(--mut); }
.pub-tbl td { padding: 10px; text-align: center; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pub-tbl .l { text-align: left; }
.pub-tbl td.l small { display: block; color: var(--mut); font-size: 12.5px; }
.pub-tbl tr.pub-grp td { background: #fafbfe; font-weight: 700; color: var(--p1); text-align: left; font-size: 14px; }
.pub-strong { font-weight: 700; }
.pub-mute { color: #a6afc2; }
.pub-bar { display: block; height: 6px; border-radius: 99px; background: #e8edf6; overflow: hidden; margin: 4px auto 0; max-width: 90px; }
.pub-bar i { display: block; height: 100%; background: #2f6df6; border-radius: 99px; }

.pub-g { display: inline-block; min-width: 44px; padding: 3px 10px; border-radius: 10px; font-weight: 700; color: #fff; font-family: "Prompt", sans-serif; }

.pub-g-2 { background: #b88300; } .pub-g-15 { background: #cf6a10; } .pub-g-1 { background: #d24b1c; } .pub-g-0 { background: #c62f3a; }
.pub-g-x { background: #fff3dc; color: #a35d00; } .pub-g-none { background: none; color: #a6afc2; }
.pub-h3 { font-size: 17px; margin: 18px 0 10px; }
.pub-evals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.pub-eval { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.pub-eval b { white-space: nowrap; }
.pub-eval.ok b { color: #11804a; } .pub-eval.bad b { color: #b4232f; }
.pub-empty { text-align: center; padding: 36px 10px; color: var(--mut); }
.pub-empty .ic { font-size: 42px; margin-bottom: 6px; }
.pub-empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; font-family: "Prompt", sans-serif; }
.pub-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.pub-foot { text-align: center; color: var(--mut); font-size: 13.5px; margin-top: 28px; }
.pub-foot a { color: var(--p1); }
[hidden] { display: none !important; }

@media (max-width: 560px) {
  .pub-fields.two { grid-template-columns: 1fr; }

  .pub-body { padding: 14px 12px; }
  .pub-tbl { font-size: 14px; } .pub-tbl td, .pub-tbl th { padding: 8px 6px; }

}

  .pub-card { box-shadow: none; border: 1px solid #ccc; }
  .pub-page { background: #fff; }
  .pub-tile.pub-hl, .pub-g, .pub-bar i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* ปุ่มสำหรับครู มุมขวาบน */
.pub-teacher-old { position: absolute !important; top: 12px; right: 12px; z-index: 3 !important; background: #ffffff26; color: #fff; border: 1px solid #ffffff55; border-radius: 999px; padding: 7px 14px; font: 500 14px "Sarabun", sans-serif; cursor: pointer; backdrop-filter: blur(4px); }

/* ระดับผลภาคเรียนที่ 1 */
.pub-lv { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; }

.pub-lv-b { background: #dbeafe; color: #1e40af; }

/* มุมมองแบบแคบ: คอลัมน์เดียวกลางจอ ตารางเป็นการ์ด */

.pub-narrow .pub-tiles { grid-template-columns: 1fr 1fr; }

/* ปุ่มเข้าสู่ระบบ + เมนูเลือก ครู / แอดมิน */
.pub-login { position: absolute !important; top: 12px; right: 12px; z-index: 30 !important; display: block; background: none; border: 0; padding: 0; backdrop-filter: none; }
