<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>วิเคราะห์ผล ปพ.5 / ปพ.6</title>
  <meta name="description" content="อัปโหลดไฟล์ ปพ.5 แต่ละวิชา แล้วดูคะแนนตามตัวชี้วัดและเกรดรายบุคคล">
  <meta name="theme-color" content="#1767ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --brand: #1767ee;
  --brand-d: #0f4fc2;
  --brand-l: #e8f0ff;
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #17233a;
  --muted: #5d6b82;
  --line: #dde4ef;
  --ok: #138a4e;
  --ok-l: #e3f6ec;
  --warn: #b26a00;
  --warn-l: #fff3dc;
  --bad: #c62f3a;
  --bad-l: #fde8ea;
  --g4: #0f8a4f; --g35: #2f9e5d; --g3: #4a9f2f; --g25: #8a9a12; --g2: #b88300; --g15: #cf6a10; --g1: #d24b1c; --g0: #c62f3a;
  --radius: 14px;
  --shadow: 0 1px 2px #17233a0f, 0 4px 14px #17233a0d;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Sarabun", system-ui, -apple-system, "Segoe UI", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: 16px; line-height: 1.5;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- ส่วนหัว ---------- */
.top { background: linear-gradient(120deg, #1557d8, #1f86f8); color: #fff; padding-top: env(safe-area-inset-top); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.home { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: #ffffff22; flex: none; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; }
.brand p { margin: 0; font-size: 14px; color: #dbe8ff; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ---------- ตัวเลือกปี/ชั้น/ห้อง ---------- */
.picker { display: flex; flex-wrap: wrap; gap: 12px 18px; padding: 12px 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 260px; }
.field label, .field .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
select { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 10px; min-width: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 600; position: relative; }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip .dot { position: absolute; top: 2px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.chip.on .dot { background: #fff; }

/* ---------- ช่องวางไฟล์ ---------- */
.drop {
  margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center;
  padding: 16px 18px; border: 2px dashed #9fbaf0; border-radius: var(--radius); background: var(--brand-l); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.drop:hover, .drop.over { background: #d8e6ff; border-color: var(--brand); }
.drop-ic { grid-row: span 2; font-size: 30px; color: var(--brand); width: 48px; height: 48px; display: grid; place-items: center; background: #fff; border-radius: 12px; }
.drop-t { font-size: 16px; }
.drop-s { font-size: 13px; color: var(--muted); }
body.dragging .drop { border-color: var(--brand); background: #d8e6ff; }

/* ---------- แท็บ ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }

h2.sec { font-size: 18px; margin: 4px 0 10px; }
.sub { color: var(--muted); font-size: 14px; margin: -6px 0 12px; }

/* ---------- ช่องรายวิชา ---------- */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.slot { padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; position: relative; }
.slot.empty { border-style: dashed; background: #fbfcfe; box-shadow: none; cursor: pointer; }
.slot.empty:hover, .slot.over { border-color: var(--brand); background: var(--brand-l); }
.slot-h { display: flex; gap: 10px; align-items: center; }
.slot-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; color: #fff; }
.slot-n { font-weight: 700; line-height: 1.3; }
.slot-c { font-size: 13px; color: var(--muted); }
.slot-f { font-size: 12.5px; color: var(--muted); word-break: break-all; background: var(--bg); border-radius: 8px; padding: 4px 8px; }
.slot-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.slot-empty-t { color: var(--muted); font-size: 14px; margin-top: auto; }
.slot-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 5px 11px; font-size: 14px; font-weight: 600; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-d); color: #fff; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.link { border: 0; background: none; color: var(--brand); padding: 0; text-decoration: underline; font-size: inherit; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-l); color: var(--ok); }
.badge.warn { background: var(--warn-l); color: var(--warn); }
.badge.bad { background: var(--bad-l); color: var(--bad); }
.badge.mute { background: var(--bg); color: var(--muted); }

/* ---------- ตาราง ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { background: #f6f8fc; font-weight: 600; color: #34425a; position: sticky; top: 0; z-index: 1; }
td.l, th.l { text-align: left; }
td.wrap-t { white-space: normal; min-width: 220px; text-align: left; }
tbody tr:hover { background: #f8fbff; }
tr.click { cursor: pointer; }
.stick { position: sticky; left: 0; background: #fff; z-index: 2; }
th.stick { background: #f6f8fc; z-index: 3; }
tfoot td { background: #f6f8fc; font-weight: 600; }
.grp { background: var(--brand-l) !important; color: var(--brand-d); }

.g { display: inline-block; min-width: 38px; padding: 1px 8px; border-radius: 8px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.g-4 { background: var(--g4); } .g-35 { background: var(--g35); } .g-3 { background: var(--g3); } .g-25 { background: var(--g25); }
.g-2 { background: var(--g2); } .g-15 { background: var(--g15); } .g-1 { background: var(--g1); } .g-0 { background: var(--g0); }
.g-x { background: var(--warn-l); color: var(--warn); }
.g-none { background: none; color: #a3adbd; font-weight: 400; }

.bar { display: inline-block; vertical-align: middle; width: 80px; height: 8px; border-radius: 99px; background: #e6ebf3; overflow: hidden; margin-left: 6px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.bar.low i { background: var(--bad); }
.bar.mid i { background: #e1a100; }
.empty-cell { color: #b5bdcb; }

/* ---------- ไทล์สรุป ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { padding: 12px 14px; }
.tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }

/* ---------- รายบุคคล ---------- */
.stu-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.stu-bar select { flex: 1 1 240px; max-width: 420px; }
.profile { padding: 16px; display: flex; flex-wrap: wrap; gap: 6px 26px; margin-bottom: 14px; align-items: center; }
.profile .nm { font-size: 22px; font-weight: 700; flex-basis: 100%; }
.profile .it { font-size: 14.5px; color: var(--muted); }
.profile .it b { color: var(--ink); font-weight: 600; }
.subj { margin-bottom: 10px; overflow: hidden; }
.subj > summary { list-style: none; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; cursor: pointer; }
.subj > summary::-webkit-details-marker { display: none; }
.subj > summary::before { content: "›"; font-size: 22px; line-height: 1; color: var(--muted); transition: transform .15s; }
.subj[open] > summary::before { transform: rotate(90deg); }
.subj .t { font-weight: 700; flex: 1 1 220px; }
.subj .t small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.subj-body { padding: 0 14px 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 10px 0; }
.kv div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.kv b { display: block; font-size: 17px; }
.note { font-size: 13.5px; color: var(--warn); background: var(--warn-l); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; }

.empty-state { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-state b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

.dist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 14px; }
.dist .card { padding: 12px 14px; }
.dist h3 { font-size: 15px; margin: 0 0 8px; }
.hbar { display: grid; grid-template-columns: 34px 1fr 28px; gap: 6px; align-items: center; font-size: 13px; margin: 2px 0; }
.hbar .tr { height: 12px; background: #eef2f8; border-radius: 99px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; border-radius: 99px; }

.privacy { font-size: 13px; color: var(--muted); text-align: center; margin-top: 26px; }

/* ---------- หน้าต่าง ---------- */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(1100px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 20px 60px #0b1a3a55; }
dialog::backdrop { background: #0b1a3a77; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 5; }
.modal-h h2 { font-size: 17px; margin: 0; flex: 1; }
.x { border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; }
#modalBody { padding: 14px 16px 18px; }
#modalBody .tbl-wrap { max-height: 64vh; }

/* ---------- แจ้งเตือน ---------- */
#toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(520px, calc(100vw - 32px)); }
.toast { background: #17233a; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; box-shadow: 0 8px 24px #0005; animation: tin .2s ease; }
.toast.ok { border-left: 5px solid #3ccf86; }
.toast.err { border-left: 5px solid #ff6b75; }
.toast.info { border-left: 5px solid #6aa5ff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

.busy { position: fixed; inset: 0; background: #ffffffaa; display: none; place-items: center; z-index: 60; font-weight: 600; }
.busy.on { display: grid; }

@media (max-width: 600px) {
  .brand h1 { font-size: 18px; }
  .tile .v { font-size: 22px; }
  table { font-size: 13.5px; }
  th, td { padding: 6px 7px; }
  .profile .nm { font-size: 19px; }
}

/* ---------- พิมพ์รายงาน ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; font-size: 13px; }
  .top, .picker, .drop, .tabs, .privacy, .stu-bar, #toasts, .no-print { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .card { box-shadow: none; }
  .subj { break-inside: avoid; }
  .subj-body { display: block !important; }
  .tbl-wrap { overflow: visible; border: 0; }
  th { position: static; }
  .print-only { display: block !important; }
  .g, .bar i, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.print-only { display: none; }

/* ---------- แผงควบคุมใบรายงาน ---------- */
.rc-panel { padding: 14px 16px; margin-bottom: 14px; }
.rc-panel h3 { margin: 0 0 10px; font-size: 16px; }
.rc-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.rc-opt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rc-opt > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--brand); color: #fff; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; }
.rc-signers { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
.rc-signers .card { padding: 10px 12px; box-shadow: none; display: grid; gap: 6px; }
.rc-signers b { font-size: 13.5px; }
.rc-signers input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 100%; font-size: 14px; }
.rc-sig-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rc-sig-pick img { height: 34px; max-width: 110px; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.rc-sig-pick select { min-width: 0; flex: 1; }
.rc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rc-actions .btn { padding: 8px 14px; }
.rc-progress { margin-top: 10px; height: 8px; border-radius: 99px; background: #e6ebf3; overflow: hidden; display: none; }
.rc-progress.on { display: block; }
.rc-progress i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .2s; }
.rc-ptext { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }

.rc-preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
.rc-preview-bar select { flex: 1 1 220px; max-width: 380px; }
.rc-preview { display: flex; flex-direction: column; align-items: center; gap: 16px; background: #dfe5ee; border-radius: var(--radius); padding: 16px 8px; overflow: hidden; }
.rc-scale { transform-origin: top left; }
.rc-fit { overflow: hidden; box-shadow: 0 4px 18px #17233a33; background: #fff; flex: none; }

/* ---------- หน้ากระดาษใบรายงาน (ออกแบบที่ A4 แนวตั้ง) ---------- */
.rc-page {
  width: 210mm; height: 297mm; padding: 11mm 13mm 10mm; background: #fff; color: #111;
  font-family: "Sarabun", "TH Sarabun New", "Leelawadee UI", Tahoma, sans-serif;
  font-size: 11.5pt; line-height: 1.32; position: relative; overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.rc-page * { box-sizing: border-box; }
.rc-page h4 { font-size: 12.5pt; margin: 3.5mm 0 1.5mm; font-weight: 700; }
.rc-head { text-align: center; position: relative; }
.rc-logo { height: 25mm; display: block; margin: 0 auto 1mm; }
.rc-title { font-size: 16pt; font-weight: 700; margin: 0; }
.rc-tag { position: absolute; right: 0; top: 0; border: 1.2px solid #111; border-radius: 2mm; padding: 0.5mm 3mm; font-weight: 700; font-size: 13pt; }
.rc-sub { font-size: 12pt; }
.rc-who { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6mm; font-size: 12.5pt; margin-top: 1mm; }
.rc-who b { font-weight: 700; }
.rc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5mm 5mm; }
.rc-t { width: 100%; border-collapse: collapse; font-size: 11pt; }
.rc-t th, .rc-t td { border: 0.8px solid #333; padding: 0.9mm 1.6mm; text-align: center; white-space: normal; position: static; background: none; color: #111; }
.rc-t th { background: #eef1f6; font-weight: 700; line-height: 1.2; }
.rc-t td.l, .rc-t th.l { text-align: left; }
.rc-t tr.grp td { background: #f5f6f8; font-weight: 700; text-align: left; }
.rc-t tr.sum td { font-weight: 700; }
.rc-t small { font-weight: 400; font-size: 9.5pt; }
.rc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
.rc-box { border: 0.8px solid #333; padding: 2mm 3mm; min-height: 18mm; }
.rc-dots { border-bottom: 1px dotted #555; height: 7.5mm; }
.rc-sign { text-align: center; margin-top: 3mm; font-size: 11.5pt; line-height: 1.35; }
.rc-sign .sig { height: 13mm; display: flex; align-items: flex-end; justify-content: center; margin-bottom: -4mm; position: relative; z-index: 1; }
.rc-sign .sig img { max-height: 15mm; max-width: 45mm; object-fit: contain; }
.rc-sign .ln { white-space: nowrap; }
.rc-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: auto; }
.rc-cb { display: inline-block; width: 3.6mm; height: 3.6mm; border: 1px solid #111; vertical-align: -0.5mm; margin-right: 1.4mm; position: relative; background: #fff; }
.rc-cb.on::after { content: ""; position: absolute; left: 0.9mm; top: -0.6mm; width: 1.2mm; height: 2.6mm; border: solid #111; border-width: 0 0.55mm 0.55mm 0; transform: rotate(45deg); }
.rc-sumlist { display: grid; gap: 2mm; font-size: 12pt; }
.rc-sumlist .it { display: grid; grid-template-columns: 7mm 1fr; }
.rc-sumlist .opts { display: flex; flex-wrap: wrap; gap: 0.5mm 8mm; margin-top: 0.5mm; }
.rc-page .op { white-space: nowrap; display: inline-block; margin-right: 6mm; }
.rc-sumlist .op, .rc-verdict .op { margin-right: 0; }
.rc-dense { font-size: 10.5pt; line-height: 1.25; }
.rc-dense .rc-t { font-size: 10pt; }
.rc-dense .rc-t th, .rc-dense .rc-t td { padding: 0.55mm 1.4mm; }
.rc-dense h4 { margin: 2.6mm 0 1.2mm; font-size: 11.5pt; }
.rc-dense .rc-sign { margin-top: 1mm; }
.rc-verdict { border: 1.2px solid #111; border-radius: 2mm; padding: 3mm 4mm; margin-top: 4mm; font-size: 13pt; }
.rc-verdict .big { font-size: 14pt; font-weight: 700; display: flex; gap: 10mm; flex-wrap: wrap; }
.rc-note { font-size: 9.5pt; color: #444; margin-top: 1mm; }
.rc-foot { margin-top: auto; font-size: 8.5pt; color: #777; text-align: right; }
.rc-blank { display: grid; place-items: center; color: #bbb; font-size: 11pt; }

/* ---------- พื้นที่ซ่อนสำหรับถ่ายภาพหน้าเป็น PDF ---------- */
#rcStage { position: fixed; left: -12000px; top: 0; width: 210mm; background: #fff; z-index: -1; }

/* ---------- พิมพ์ผ่านเบราว์เซอร์ ---------- */
#rcPrint { display: none; }
@media print {
  body.rc-printing > *:not(#rcPrint) { display: none !important; }
  body.rc-printing #rcPrint { display: block; }
  body.rc-printing { background: #fff; }
  #rcPrint .sheet { break-after: page; page-break-after: always; overflow: hidden; position: relative; }
  #rcPrint .sheet:last-child { break-after: auto; page-break-after: auto; }
  #rcPrint .sheet.a4 { width: 210mm; height: 296mm; }
  #rcPrint .sheet.half { width: 297mm; height: 209mm; display: flex; }
  #rcPrint .sheet.half .slot { width: 148.5mm; height: 209mm; overflow: hidden; position: relative; }
  #rcPrint .sheet.half .slot + .slot { border-left: 0.3mm dashed #999; }
  #rcPrint .sheet.half .slot > .rc-page { transform: scale(0.7071); transform-origin: top left; }
  #rcPrint .rc-page, #rcPrint .rc-t th, #rcPrint .rc-t tr.grp td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

[hidden]{display:none!important}

<script>
/* ที่เก็บข้อมูลรุ่น Apps Script: เรียกฟังก์ชันใน Code.gs ผ่าน google.script.run แล้วเก็บไฟล์ใน Google Drive */
(function () {
  'use strict';

  // ไลบรารีสร้าง PDF โหลดจาก CDN (Apps Script เก็บไฟล์ใหญ่ไม่สะดวก)
  window.PP5_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
  ];

  var PIN_KEY = 'pp5-pin';
  function getPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return window.__pp5pin || ''; } }
  function setPin(v) { window.__pp5pin = v; try { localStorage.setItem(PIN_KEY, v); } catch (e) { /* ใช้ค่าในหน่วยความจำ */ } }

  function raw(fn, args) {
    return new Promise(function (res, rej) {
      var runner = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
        rej(e instanceof Error ? e : new Error(e && e.message ? e.message : String(e)));
      });
      runner[fn].apply(runner, [getPin()].concat(args || []));
    });
  }
  function call(fn, args, tries) {
    return raw(fn, args).catch(function (err) {
      if (/PIN_REQUIRED/.test(err && err.message) && (tries || 0) < 3) {
        var p = window.prompt((tries ? 'รหัสผ่านไม่ถูกต้อง ' : '') + 'กรุณาใส่รหัสผ่านของระบบ');
        if (p == null) throw new Error('ต้องใส่รหัสผ่านเพื่อเข้าใช้งาน');
        setPin(p.trim());
        return call(fn, args, (tries || 0) + 1);
      }
      throw err;
    });
  }

  function blobToB64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).replace(/^data:[^,]*,/, '')); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  var MAX_UPLOAD = 40 * 1024 * 1024;

  window.PP5_STORE = {
    rootUrl: null,
    open: function () {
      var self = this;
      return call('api_ping').then(function (r) {
        self.rootUrl = r && r.rootUrl;
        var link = document.getElementById('driveLink');
        if (link && self.rootUrl) { link.href = self.rootUrl; link.hidden = false; }
      });
    },
    all: function () { return call('api_list'); },
    put: async function (rec) {
      if (rec.size > MAX_UPLOAD) throw new Error('ไฟล์ใหญ่เกินไป (เกิน 40 MB)');
      var b64 = await blobToB64(rec.blob);
      var entry = {
        key: rec.key, year: rec.year, level: rec.level, room: rec.room, stage: rec.data && rec.data.meta.stage,
        slot: rec.slot, fileName: rec.fileName, origName: rec.origName, size: rec.size, uploadedAt: rec.uploadedAt,
        mime: rec.blob.type || 'application/octet-stream', school: rec.data && rec.data.meta.school || '',
        settings: rec.settings || null
      };
      var saved = await call('api_save', [entry, b64, JSON.stringify(rec.data)]);
      delete rec.blob; // ไฟล์อยู่ใน Drive แล้ว
      return saved;
    },
    ensureData: async function (recs) {
      var map = await call('api_getData', [recs.map(function (r) { return r.key; })]);
      recs.forEach(function (r) { if (map && map[r.key]) r.data = JSON.parse(map[r.key]); });
    },
    saveSettings: function (rec) { return call('api_saveSettings', [rec.key, JSON.stringify(rec.settings || {})]); },
    del: function (key) { return call('api_delete', [key]); },
    clear: function () { return call('api_clear'); },
    download: function (rec) {
      if (rec.url) window.open(rec.url, '_blank', 'noopener');
      else alert('ไม่พบลิงก์ไฟล์ใน Drive');
    },
    saveOutput: async function (blob, name) {
      if (blob.size > MAX_UPLOAD) throw new Error('ไฟล์ใหญ่เกินกว่าจะเก็บสำเนาใน Drive อัตโนมัติ');
      return call('api_saveOutput', [name, await blobToB64(blob), blob.type || 'application/pdf']);
    }
  };
})();

<script>
/*
 * ตัวถอดข้อมูลไฟล์ ปพ.5 (โปรแกรม ปพ.5 ระดับประถมศึกษา แบบเก็บคะแนนตามตัวชี้วัด)
 * อ่านไฟล์ .xlsm / .xlsx ด้วย SheetJS แล้วแปลงเป็นข้อมูลรายนักเรียน
 *
 * หลักการ: หาหัวตารางจาก "ข้อความ" ในชีต (เช่น "ที่", "ชื่อ-สกุล", "คะแนนเก็บ")
 * ไม่ยึดตำแหน่งเซลล์ตายตัว เพื่อให้ยังอ่านได้แม้แต่ละไฟล์ต่างกันเล็กน้อย
 *
 * หมายเหตุเรื่องความเป็นส่วนตัว: จงใจ "ไม่อ่าน" เลขประจำตัวประชาชน
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory;
  else root.PP5Parser = factory(root.XLSX);
})(typeof self !== 'undefined' ? self : this, function (XLSX) {
  'use strict';

  var ERR_RE = /^#(DIV\/0!|N\/A|VALUE!|REF!|NAME\?|NUM!|NULL!)$/;
  // ในไฟล์ใช้ฟอนต์ Wingdings 2: P = ✓ (ผ่าน), O = ✗ (ไม่ผ่าน)
  var TICK = { 'P': true, '✓': true, '✔': true, '/': true, 'ผ': true, 'ผ.': true, 'ผ่าน': true };
  var CROSS = { 'O': false, 'Q': false, 'x': false, 'X': false, '×': false, '✗': false, 'มผ': false, 'มผ.': false, 'ไม่ผ่าน': false };

  function enc(r, c) { return XLSX.utils.encode_cell({ r: r, c: c }); }

  function cell(ws, r, c) {
    var x = ws[enc(r, c)];
    if (!x || x.t === 'e' || x.t === 'z') return null;
    var v = x.v;
    if (typeof v === 'string') {
      v = v.replace(/\s+/g, ' ').trim();
      if (v === '' || ERR_RE.test(v)) return null;
    }
    return v;
  }

  function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, ''); }

  function num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/,/g, '').trim();
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    return parseFloat(s);
  }

  function round(v, d) {
    if (v == null) return null;
    var p = Math.pow(10, d == null ? 2 : d);
    return Math.round(v * p) / p;
  }

  function tick(v) {
    if (v == null) return null;
    var s = String(v).trim();
    if (s in TICK) return true;
    if (s in CROSS) return false;
    return null;
  }

  function bounds(ws) {
    return XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
  }

  // คอลัมน์สุดท้ายก่อนส่วน "กราฟ" (ส่วนกราฟอยู่ด้านขวาของหลายชีต)
  function tableEnd(ws) {
    var b = bounds(ws), end = b.e.c;
    for (var c = 0; c <= b.e.c; c++) {
      var v = cell(ws, 0, c);
      if (typeof v === 'string' && v.indexOf('กราฟ') === 0) { end = c - 1; break; }
    }
    return end;
  }

  // หาเซลล์ที่ข้อความตรงกับ label ในช่วงแถว/คอลัมน์ที่กำหนด
  function findLabel(ws, label, r0, r1, c0, c1) {
    var want = norm(label);
    for (var r = r0; r <= r1; r++) {
      for (var c = c0; c <= c1; c++) {
        if (norm(cell(ws, r, c)) === want) return { r: r, c: c };
      }
    }
    return null;
  }

  // หาหัวตารางนักเรียน: แถวที่มี "ที่" และถัดไปเป็น "ชื่อ-สกุล" (หนึ่งชีตอาจมีหลายบล็อกเรียงซ้าย-ขวา)
  function findBlocks(ws, maxRow) {
    var b = bounds(ws), end = tableEnd(ws), out = [];
    for (var r = 0; r <= Math.min(maxRow || 12, b.e.r); r++) {
      for (var c = 0; c <= end; c++) {
        if (norm(cell(ws, r, c)) === 'ที่' && norm(cell(ws, r, c + 1)).indexOf('ชื่อ') === 0) {
          out.push({ r: r, cNo: c, cName: c + 1 });
        }
      }
      if (out.length) return out;
    }
    return out;
  }

  // แถวข้อมูลนักเรียน: คอลัมน์ "ที่" เป็นตัวเลข และมีชื่อ
  function studentRows(ws, block) {
    var b = bounds(ws), rows = [];
    for (var r = block.r + 1; r <= b.e.r; r++) {
      var no = num(cell(ws, r, block.cNo));
      var name = cell(ws, r, block.cName);
      if (no != null && typeof name === 'string' && name.length > 1) rows.push({ r: r, no: no, name: name });
    }
    return rows;
  }

  function sheet(wb, name) {
    if (wb.Sheets[name]) return wb.Sheets[name];
    var want = norm(name);
    for (var i = 0; i < wb.SheetNames.length; i++) {
      if (norm(wb.SheetNames[i]) === want) return wb.Sheets[wb.SheetNames[i]];
    }
    return null;
  }

  // ---------------- ตั้งค่า ----------------
  var SETTING_LABELS = {
    'ปีการศึกษา': 'year', 'โรงเรียน': 'school', 'ตำบล': 'subdistrict', 'อำเภอ': 'district',
    'จังหวัด': 'province', 'ชั้น': 'gradeName', 'ห้อง': 'room', 'กลุ่มสาระ': 'group',
    'รหัสวิชา': 'code', 'วิชา': 'subject', 'หน่วยกิต': 'credit', 'ประเภทวิชา': 'type',
    'คะแนนเก็บระหว่างภาคเรียน': 'maxCollect', 'คะแนนปลายภาค': 'maxFinal', 'ครูผู้สอน': 'teacher',
    'เวลาเรียน1ปีการศึกษา': 'hours', 'สังกัด:สพป./สพม./อื่นๆ': 'office'
  };

  function parseSettings(ws) {
    var meta = {}, b = bounds(ws);
    for (var r = 0; r <= Math.min(b.e.r, 50); r++) {
      for (var c = 0; c <= Math.min(b.e.c, 12); c++) {
        var key = SETTING_LABELS[norm(cell(ws, r, c))];
        if (!key || meta[key] != null) continue;
        for (var k = c + 1; k <= c + 4; k++) {
          var v = cell(ws, r, k);
          if (v != null) { meta[key] = v; break; }
        }
      }
    }
    return meta;
  }

  function normalizeMeta(meta) {
    var m = {};
    for (var k in meta) m[k] = meta[k];
    m.year = num(m.year);
    m.room = num(m.room) || 1;
    m.credit = num(m.credit);
    m.hours = num(m.hours);
    m.maxCollect = num(m.maxCollect);
    m.maxFinal = num(m.maxFinal);
    m.code = m.code ? String(m.code).replace(/\s+/g, '') : '';
    m.subject = m.subject ? String(m.subject) : '';

    var stage = 'ป', level = null;
    var g = m.gradeName ? String(m.gradeName) : '';
    if (/มัธยม/.test(g)) stage = 'ม';
    var mm = g.match(/(\d)/);
    if (mm) level = +mm[1];
    // สำรอง: เดาจากรหัสวิชา เช่น ส14101 -> ประถม (1) ปีที่ 4
    var cm = m.code.match(/^[ก-ฮ](\d)(\d)(\d)(\d\d)$/);
    if (cm) {
      if (level == null) level = +cm[2];
      if (!g) stage = cm[1] === '1' ? 'ป' : 'ม';
    }
    m.stage = stage;
    m.level = level;
    m.levelName = level ? stage + '.' + level : '';
    return m;
  }

  // ---------------- รายชื่อนักเรียน ----------------
  function parseRoster(ws) {
    var blocks = findBlocks(ws, 10);
    if (!blocks.length) {
      // ชีตรายชื่อใช้หัว "ที่ | เลขประจำตัวนักเรียน | ..."
      var h = findLabel(ws, 'ที่', 0, 10, 0, 2);
      if (!h) return {};
      blocks = [{ r: h.r, cNo: h.c }];
    }
    var hr = blocks[0].r, b = bounds(ws), cols = {};
    var map = { 'เลขประจำตัวนักเรียน': 'id', 'คำนำหน้า': 'prefix', 'ชื่อ': 'first', 'นามสกุล': 'last', 'เพศ': 'sex', 'สถานะ': 'status' };
    for (var c = 0; c <= Math.min(b.e.c, 15); c++) {
      var key = map[norm(cell(ws, hr, c))];
      if (key) cols[key] = c;
    }
    var out = {};
    for (var r = hr + 1; r <= b.e.r; r++) {
      var no = num(cell(ws, r, blocks[0].cNo));
      var first = cols.first != null ? cell(ws, r, cols.first) : null;
      if (no == null || !first) continue;
      var s = { no: no };
      for (var k in cols) {
        var v = cell(ws, r, cols[k]);
        s[k] = v == null ? '' : String(v);
      }
      out[no] = s;
    }
    return out;
  }

  // ---------------- ตัวชี้วัด (คำอธิบาย) ----------------
  function parseIndicatorTexts(ws) {
    var out = {};
    if (!ws) return out;
    var b = bounds(ws), hr = null;
    for (var r = 0; r <= 10 && hr == null; r++) {
      for (var c = 0; c <= b.e.c; c++) {
        if (norm(cell(ws, r, c)) === 'ที่' && norm(cell(ws, r, c + 1)) === 'ภาคเรียนที่') { hr = r; break; }
      }
    }
    if (hr == null) return out;
    var starts = [];
    for (var c2 = 0; c2 <= b.e.c; c2++) if (norm(cell(ws, hr, c2)) === 'ที่') starts.push(c2);
    starts.forEach(function (s, i) {
      var end = i + 1 < starts.length ? starts[i + 1] - 1 : b.e.c;
      var col = {};
      for (var c = s; c <= end; c++) {
        var t = norm(cell(ws, hr, c));
        if (t === 'ภาคเรียนที่') col.term = c;
        else if (t === 'มาตรฐานที่') col.std = c;
        else if (t === 'ตัวชี้วัดที่') col.code = c;
        else if (t === 'ตัวชี้วัด') col.text = c;
      }
      for (var r = hr + 1; r <= b.e.r; r++) {
        var idx = num(cell(ws, r, s));
        if (idx == null) continue;
        var text = col.text != null ? cell(ws, r, col.text) : null;
        var code = col.code != null ? cell(ws, r, col.code) : null;
        if (!text && !code) continue;
        out[idx] = {
          term: col.term != null ? num(cell(ws, r, col.term)) : null,
          std: col.std != null ? String(cell(ws, r, col.std) || '').trim() : '',
          code: code ? String(code).trim() : '',
          text: text ? String(text) : ''
        };
      }
    });
    return out;
  }

  // ---------------- คะแนนเก็บตามตัวชี้วัด / ประเมินตัวชี้วัด ----------------
  // ทั้งสองชีตมีหัวตารางแบบเดียวกัน: ลำดับที่ / ภาคเรียนที่ / มาตรฐาน / ตัวชี้วัด / (คะแนนเต็ม) / คะแนน
  function indicatorGrid(ws, withPass) {
    var res = { indicators: [], byNo: {} };
    if (!ws) return res;
    var blocks = findBlocks(ws, 10);
    blocks.forEach(function (bk, i) {
      var cLab = bk.cName + 1;
      if (norm(cell(ws, bk.r, cLab)) !== 'ลำดับที่') return;
      var rows = {};
      for (var r = bk.r; r <= bk.r + 8; r++) {
        var t = norm(cell(ws, r, cLab));
        if (t === 'ลำดับที่') rows.idx = r;
        else if (t === 'ภาคเรียนที่') rows.term = r;
        else if (t === 'มาตรฐาน') rows.std = r;
        else if (t === 'ตัวชี้วัด') rows.code = r;
        else if (t === 'คะแนนเต็ม') rows.max = r;
        else if (t === 'คะแนน') rows.score = r;
      }
      if (rows.idx == null) return;
      var end = i + 1 < blocks.length ? blocks[i + 1].cNo - 1 : tableEnd(ws);
      var students = studentRows(ws, bk);
      for (var c = cLab + 1; c <= end; c++) {
        var idx = num(cell(ws, rows.idx, c));
        if (idx == null) continue;
        var code = rows.code != null ? cell(ws, rows.code, c) : null;
        var max = rows.max != null ? num(cell(ws, rows.max, c)) : null;
        if (!code && max == null) continue; // ช่องที่ไม่ได้ใช้
        var ind = {
          idx: idx,
          term: rows.term != null ? num(cell(ws, rows.term, c)) : null,
          std: rows.std != null ? String(cell(ws, rows.std, c) || '').trim() : '',
          code: code ? String(code).trim() : '',
          max: max
        };
        res.indicators.push(ind);
        // คอลัมน์ "ผ" (ผ่าน) อยู่ทางขวาของคอลัมน์ "ได้"
        var passCol = null;
        if (withPass && rows.score != null) {
          for (var k = c + 1; k <= c + 2; k++) if (norm(cell(ws, rows.score, k)) === 'ผ') { passCol = k; break; }
        }
        students.forEach(function (s) {
          var v = num(cell(ws, s.r, c));
          var st = res.byNo[s.no] || (res.byNo[s.no] = { name: s.name, vals: {} });
          if (withPass) st.vals[idx] = { level: v, pass: passCol != null ? tick(cell(ws, s.r, passCol)) : null };
          else st.vals[idx] = v;
        });
      }
    });
    res.indicators.sort(function (a, b) { return a.idx - b.idx; });
    return res;
  }

  // ---------------- ประเมินผลการเรียน ----------------
  function parseResults(ws) {
    var out = { max: {}, byNo: {} };
    if (!ws) return out;
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], end = tableEnd(ws), r0 = bk.r, col = {};
    function lab(t, from) {
      var f = findLabel(ws, t, r0, r0 + 2, from || 0, end);
      return f ? f.c : null;
    }
    col.indTotal = lab('รวมคะแนนตัวชี้วัด');
    col.collect = lab('คะแนนเก็บ');
    col.final = lab('ปลายภาค');
    col.mid = lab('ข้อสอบกลาง');
    col.total = col.final != null ? lab('รวม', col.final) : lab('รวม');
    col.rms = lab('ผลการเรียนร,มส');
    col.grade = lab('ผลการเรียน(เกรด)');
    var sum = lab('สรุปผลการประเมิน');
    var pass = sum != null ? findLabel(ws, 'ผ่าน', r0, r0 + 3, sum, sum + 3) : null;
    var fail = sum != null ? findLabel(ws, 'ไม่ผ่าน', r0, r0 + 3, sum, sum + 4) : null;
    // แถวคะแนนเต็ม = แถวที่อยู่ก่อนแถว "คะแนน / ได้"
    var scoreRow = findLabel(ws, 'คะแนน', r0, r0 + 6, bk.cName, bk.cName + 2);
    if (scoreRow) {
      ['indTotal', 'collect', 'final', 'mid', 'total'].forEach(function (k) {
        if (col[k] != null) out.max[k] = num(cell(ws, scoreRow.r - 1, col[k]));
      });
    }
    studentRows(ws, bk).forEach(function (s) {
      var g = col.grade != null ? cell(ws, s.r, col.grade) : null;
      var rms = col.rms != null ? cell(ws, s.r, col.rms) : null;
      var p = null;
      if (pass && tick(cell(ws, s.r, pass.c)) != null) p = true;
      if (fail && tick(cell(ws, s.r, fail.c)) != null) p = false;
      out.byNo[s.no] = {
        name: s.name,
        indTotal: col.indTotal != null ? num(cell(ws, s.r, col.indTotal)) : null,
        collect: col.collect != null ? num(cell(ws, s.r, col.collect)) : null,
        final: col.final != null ? num(cell(ws, s.r, col.final)) : null,
        mid: col.mid != null ? num(cell(ws, s.r, col.mid)) : null,
        total: col.total != null ? num(cell(ws, s.r, col.total)) : null,
        rms: rms ? String(rms) : '',
        grade: g == null ? '' : String(g),
        pass: p
      };
    });
    return out;
  }

  // ---------------- สรุปเวลาเรียน ----------------
  function parseAttendance(ws) {
    var out = { hours: {}, byNo: {} };
    if (!ws) return out;
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], end = tableEnd(ws), r0 = bk.r;
    var groups = { t1: 'ภาคเรียนที่1', t2: 'ภาคเรียนที่2', year: 'รวม1ปีการศึกษา' };
    var gc = {};
    for (var k in groups) {
      var f = findLabel(ws, groups[k], r0, r0, 0, end);
      if (f) { gc[k] = f.c; out.hours[k] = num(cell(ws, r0 + 1, f.c + 3)); }
    }
    var res = findLabel(ws, 'ผลการประเมิน', r0, r0, 0, end);
    studentRows(ws, bk).forEach(function (s) {
      var a = {};
      for (var k in gc) {
        var c = gc[k];
        a[k] = {
          sick: num(cell(ws, s.r, c)), leave: num(cell(ws, s.r, c + 1)), absent: num(cell(ws, s.r, c + 2)),
          present: num(cell(ws, s.r, c + 3)), pct: round(num(cell(ws, s.r, c + 4)), 2)
        };
      }
      a.result = res ? String(cell(ws, s.r, res.c) || '') : '';
      out.byNo[s.no] = a;
    });
    return out;
  }

  // ---------------- สรุปประเมินตัวชี้วัด ----------------
  function parseIndicatorSummary(ws) {
    var out = { byNo: {} };
    if (!ws) return out;
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], end = tableEnd(ws), r0 = bk.r;
    var yr = findLabel(ws, 'รวม1ปีการศึกษา', r0, r0, 0, end);
    var res = findLabel(ws, 'ผลการประเมิน', r0, r0, 0, end);
    if (!yr) return out;
    var failC = findLabel(ws, 'ไม่ผ่าน', r0, r0 + 4, yr.c + 1, yr.c + 6);
    var totRow = findLabel(ws, 'ผ่าน', r0, r0 + 4, yr.c, yr.c);
    out.total = totRow ? num(cell(ws, totRow.r - 1, yr.c)) : null;
    studentRows(ws, bk).forEach(function (s) {
      out.byNo[s.no] = {
        pass: num(cell(ws, s.r, yr.c)),
        fail: failC ? num(cell(ws, s.r, failC.c)) : null,
        result: res ? String(cell(ws, s.r, res.c) || '') : ''
      };
    });
    return out;
  }

  // ---------------- คุณลักษณะอันพึงประสงค์ ----------------
  function parseCharacteristics(ws, listWs) {
    var out = { items: [], byNo: {} };
    if (!ws) return out;
    var names = {};
    if (listWs) {
      var lb = bounds(listWs);
      for (var r = 0; r <= lb.e.r; r++) {
        var n = num(cell(listWs, r, 0)), t = cell(listWs, r, 1);
        if (n != null && t) names[n] = String(t);
      }
    }
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], end = tableEnd(ws), r0 = bk.r;
    var avg = findLabel(ws, 'คะแนนเฉลี่ย', r0, r0, 0, end);
    var lvl = findLabel(ws, 'ผลการประเมิน', r0, r0, 0, end);
    var tot = findLabel(ws, 'รวม', r0, r0, 0, end);
    var stop = tot ? tot.c : end;
    // แถวหมายเลขข้อ = r0+1, แถวคะแนนเต็ม = แถวที่มีตัวเลขใต้ "เต็ม"
    var fullRow = findLabel(ws, 'เต็ม', r0, r0 + 4, bk.cName + 1, stop);
    var maxRow = fullRow ? fullRow.r + 1 : r0 + 3;
    for (var c = bk.cName + 1; c < stop; c++) {
      var no = num(cell(ws, r0 + 1, c));
      var mx = num(cell(ws, maxRow, c));
      if (no != null && mx != null) out.items.push({ no: no, col: c, max: mx, name: names[no] || ('ข้อ ' + no) });
    }
    studentRows(ws, bk).forEach(function (s) {
      var items = {};
      out.items.forEach(function (it) { items[it.no] = num(cell(ws, s.r, it.col)); });
      var text = '';
      if (lvl) for (var k = lvl.c + 1; k <= lvl.c + 3; k++) {
        var v = cell(ws, s.r, k);
        if (typeof v === 'string' && !/^\d/.test(v)) { text = v; break; }
      }
      out.byNo[s.no] = {
        items: items,
        avg: avg ? round(num(cell(ws, s.r, avg.c)), 2) : null,
        level: lvl ? num(cell(ws, s.r, lvl.c)) : null,
        text: text
      };
    });
    out.items.forEach(function (it) { delete it.col; });
    return out;
  }

  // ---------------- อ่าน คิดวิเคราะห์ เขียน ----------------
  function parseRTW(ws) {
    var out = { byNo: {} };
    if (!ws) return out;
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], end = tableEnd(ws), r0 = bk.r;
    var terms = {};
    ['t1', 't2'].forEach(function (k, i) {
      var f = findLabel(ws, 'ภาคเรียนที่' + (i + 1), r0, r0 + 2, 0, end);
      if (!f) return;
      var cols = {}, map = { 'อ่าน': 'read', 'คิด': 'think', 'เขียน': 'write', 'เฉลี่ย': 'avg' };
      for (var r = f.r; r <= f.r + 3; r++) for (var c = f.c; c <= f.c + 8; c++) {
        var key = map[norm(cell(ws, r, c))];
        if (key && cols[key] == null) cols[key] = c;
      }
      terms[k] = cols;
    });
    var avgs = [];
    for (var c = 0; c <= end; c++) if (norm(cell(ws, r0, c)) === 'คะแนนเฉลี่ย') avgs.push(c);
    var yearAvg = avgs.length > 1 ? avgs[avgs.length - 1] : null;
    var lvl = findLabel(ws, 'ผลการประเมิน', r0, r0, 0, end);
    var sum = findLabel(ws, 'สรุปผลการประเมิน', r0, r0, 0, end);
    var sumCols = [];
    if (sum) ['ดีเยี่ยม', 'ดี', 'ผ่าน', 'ไม่ผ่าน'].forEach(function (t) {
      var f = findLabel(ws, t, r0 + 1, r0 + 3, sum.c, sum.c + 8);
      if (f) sumCols.push({ c: f.c, t: t });
    });
    studentRows(ws, bk).forEach(function (s) {
      var o = {};
      for (var k in terms) {
        o[k] = {};
        for (var j in terms[k]) o[k][j] = round(num(cell(ws, s.r, terms[k][j])), 2);
      }
      o.avg = yearAvg != null ? round(num(cell(ws, s.r, yearAvg)), 2) : null;
      o.level = lvl ? num(cell(ws, s.r, lvl.c)) : null;
      o.text = '';
      sumCols.forEach(function (x) { if (tick(cell(ws, s.r, x.c)) === true) o.text = x.t; });
      out.byNo[s.no] = o;
    });
    return out;
  }

  // ---------------- กิจกรรมพัฒนาผู้เรียน ----------------
  function parseActivities(ws) {
    var out = { byNo: {} };
    if (!ws) return out;
    var blocks = findBlocks(ws, 6);
    if (!blocks.length) return out;
    var bk = blocks[0], b = bounds(ws), r0 = bk.r;
    var sum = findLabel(ws, 'สรุปผล', r0, r0, 0, b.e.c);
    var club = findLabel(ws, 'ชื่อชุมนุม', r0, r0 + 3, 0, b.e.c);
    var acts = [];
    if (sum) {
      var map = { 'แนะแนว': 'guidance', 'ลูกเสือ-เนตรนารี': 'scout', 'ชุมนุม': 'club', 'กิจกรรมเพื่อสังคม': 'social' };
      for (var c = sum.c; c <= sum.c + 6; c++) {
        var key = map[norm(cell(ws, r0 + 1, c))];
        if (key) acts.push({ key: key, c: c });
      }
    }
    studentRows(ws, bk).forEach(function (s) {
      var o = { clubName: club ? String(cell(ws, s.r, club.c) || '') : '' };
      acts.forEach(function (a) { o[a.key] = String(cell(ws, s.r, a.c) || ''); });
      out.byNo[s.no] = o;
    });
    return out;
  }

  // ---------------- รวมทุกอย่าง ----------------
  function parseWorkbook(wb) {
    var setWs = sheet(wb, 'ตั้งค่า');
    if (!setWs || !sheet(wb, 'คะแนนเก็บตามตัวชี้วัด')) {
      throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ ปพ.5 แบบเก็บคะแนนตามตัวชี้วัด (ไม่พบชีต "ตั้งค่า" หรือ "คะแนนเก็บตามตัวชี้วัด")');
    }
    var meta = normalizeMeta(parseSettings(setWs));
    if (!meta.code && !meta.subject) throw new Error('ไม่พบรหัสวิชา/ชื่อวิชาในชีต "ตั้งค่า"');
    if (!meta.level) throw new Error('ไม่พบชั้นเรียนในชีต "ตั้งค่า"');

    var roster = parseRoster(sheet(wb, 'รายชื่อนักเรียน'));
    var texts = parseIndicatorTexts(sheet(wb, 'ตัวชี้วัด'));
    var scores = indicatorGrid(sheet(wb, 'คะแนนเก็บตามตัวชี้วัด'), false);
    var levels = indicatorGrid(sheet(wb, 'ประเมินตัวชี้วัด'), true);
    var results = parseResults(sheet(wb, 'ประเมินผลการเรียน'));
    var att = parseAttendance(sheet(wb, 'สรุปเวลาเรียน'));
    var indSum = parseIndicatorSummary(sheet(wb, 'สรุปประเมินตัวชี้วัด'));
    var chars = parseCharacteristics(sheet(wb, 'ประเมินคุณลักษณะ'), sheet(wb, 'คุณลักษณะอันพึงประสงค์'));
    var rtw = parseRTW(sheet(wb, 'สรุปประเมินอ่านคิดเขียน'));
    var acts = parseActivities(sheet(wb, 'ประเมินกิจกรรมพัฒนาผู้เรียน'));

    var indicators = scores.indicators.map(function (ind) {
      var t = texts[ind.idx] || {};
      return {
        idx: ind.idx, term: ind.term != null ? ind.term : t.term, std: ind.std || t.std || '',
        code: ind.code || t.code || '', text: t.text || '', max: ind.max
      };
    });

    // รายชื่อหลัก: ใช้ชีตรายชื่อ ถ้าไม่มีใช้ชื่อจากชีตคะแนน
    var nos = {};
    Object.keys(roster).forEach(function (n) { nos[n] = 1; });
    Object.keys(scores.byNo).forEach(function (n) { nos[n] = 1; });
    var students = Object.keys(nos).map(Number).sort(function (a, b) { return a - b; }).map(function (no) {
      var ro = roster[no] || {};
      var sc = scores.byNo[no] || { vals: {} };
      var fullName = ro.first ? ((ro.prefix || '') + ro.first + ' ' + (ro.last || '')).trim() : (sc.name || '').replace(/\s+/g, ' ');
      var filled = indicators.filter(function (i) { return sc.vals[i.idx] != null; }).length;
      return {
        no: no, id: ro.id || '', prefix: ro.prefix || '', first: ro.first || '', last: ro.last || '',
        name: fullName, sex: ro.sex || '', status: ro.status || '',
        scores: sc.vals, levels: (levels.byNo[no] || {}).vals || {},
        filled: filled,
        result: results.byNo[no] || null,
        attendance: att.byNo[no] || null,
        indSummary: indSum.byNo[no] || null,
        characteristics: chars.byNo[no] || null,
        rtw: rtw.byNo[no] || null,
        activities: acts.byNo[no] || null
      };
    }).filter(function (s) { return s.name; });

    return {
      format: 'pp5-indicator', version: 1,
      meta: meta,
      indicators: indicators,
      characteristicItems: chars.items,
      maxima: results.max,
      hours: att.hours,
      indicatorTotal: indSum.total || indicators.length,
      students: students
    };
  }

  function parseArrayBuffer(buf) {
    var wb = XLSX.read(buf, { type: 'array', cellFormula: false, cellHTML: false, cellStyles: false, bookVBA: false });
    return parseWorkbook(wb);
  }

  return { parseWorkbook: parseWorkbook, parseArrayBuffer: parseArrayBuffer, normalizeMeta: normalizeMeta };
});

</script>
<script>
/*
 * ตัวถอดข้อมูลไฟล์ ปพ.6 (แบบรายงานการพัฒนาคุณภาพผู้เรียนรายบุคคล ทั้งห้อง)
 * ชีตที่ใช้: ผลสัมฤทธิ์ฯ เทอม 1/2, บันทึกเวลาเรียน, บันทึกสุขภาพและพฤติกรรมนักเรียน,
 * การคิดวิเคราะห์และเขียน, คุณลักษณะอันพึงประสงค์, สมรรถนะของผู้เรียน, ข้อมูลทั้งหมด,
 * ใบรายงานผลการเรียน รายบุคคล (ผู้ลงนาม ตารางตัวชี้วัด โลโก้ และลายเซ็น)
 *
 * ไม่ใช้ค่าเกรด/เกรดเฉลี่ยที่คำนวณไว้ในไฟล์ (มักเป็น #VALUE! เมื่อยังไม่มีคะแนนภาค 2)
 * แต่เก็บคะแนนดิบไว้ให้ส่วนรายงานคำนวณเองตามสูตรเดียวกับไฟล์
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory;
  else root.PP6Parser = factory(root.XLSX);
})(typeof self !== 'undefined' ? self : this, function (XLSX) {
  'use strict';

  var ERR_RE = /^#(DIV\/0!|N\/A|VALUE!|REF!|NAME\?|NUM!|NULL!)$/;
  var REPORT_SHEET = 'ใบรายงานผลการเรียน รายบุคคล';

  function enc(r, c) { return XLSX.utils.encode_cell({ r: r, c: c }); }
  function cell(ws, r, c) {
    if (!ws) return null;
    var x = ws[enc(r, c)];
    if (!x || x.t === 'e' || x.t === 'z') return null;
    var v = x.v;
    if (typeof v === 'string') {
      v = v.replace(/\s+/g, ' ').trim();
      if (v === '' || ERR_RE.test(v)) return null;
    }
    return v;
  }
  function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, ''); }
  function num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/,/g, '').trim();
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
  }
  function str(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim(); }
  function bounds(ws) { return XLSX.utils.decode_range(ws['!ref'] || 'A1:A1'); }
  function sheet(wb, name) {
    if (wb.Sheets[name]) return wb.Sheets[name];
    var want = norm(name);
    for (var i = 0; i < wb.SheetNames.length; i++) if (norm(wb.SheetNames[i]) === want) return wb.Sheets[wb.SheetNames[i]];
    return null;
  }
  function find(ws, pred, r0, r1, c0, c1) {
    if (!ws) return null;
    var b = bounds(ws);
    r1 = Math.min(r1 == null ? b.e.r : r1, b.e.r);
    c1 = Math.min(c1 == null ? b.e.c : c1, b.e.c);
    for (var r = r0 || 0; r <= r1; r++) for (var c = c0 || 0; c <= c1; c++) {
      var v = cell(ws, r, c);
      if (v != null && pred(norm(v), v)) return { r: r, c: c, v: v };
    }
    return null;
  }
  function eq(t) { t = norm(t); return function (v) { return v === t; }; }
  function starts(t) { t = norm(t); return function (v) { return v.indexOf(t) === 0; }; }
  // ค่าในเซลล์ถัดไปทางขวาของป้ายกำกับ
  function after(ws, label, r0, r1) {
    var f = find(ws, eq(label), r0 || 0, r1 == null ? 3 : r1);
    if (!f) return null;
    for (var c = f.c + 1; c <= f.c + 8; c++) { var v = cell(ws, f.r, c); if (v != null) return v; }
    return null;
  }
  // หัวตาราง "เลขที่" แล้วแถวนักเรียนที่คอลัมน์ A เป็นตัวเลขและมีชื่อ
  function header(ws) { return find(ws, eq('เลขที่'), 0, 8, 0, 3); }
  function rows(ws, hr, firstNameCol) {
    var b = bounds(ws), out = [];
    for (var r = hr + 1; r <= b.e.r; r++) {
      var no = num(cell(ws, r, 0));
      if (no == null) { if (out.length && cell(ws, r, 0) != null) break; continue; }
      var first = cell(ws, r, firstNameCol);
      if (first && typeof first === 'string') out.push({ r: r, no: no });
    }
    return out;
  }
  function round(v, d) { if (v == null) return null; var p = Math.pow(10, d == null ? 2 : d); return Math.round(v * p) / p; }

  // ---------- ผลสัมฤทธิ์รายภาค ----------
  function parseTerm(ws) {
    var out = { subjects: [], byNo: {}, students: [], info: {} };
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r, b = bounds(ws);
    out.info = {
      year: num(after(ws, 'ปีการศึกษา', 0, hr - 1)),
      className: str(after(ws, 'ชั้น', 0, hr - 1)),
      teacher: str(after(ws, 'ครูประจำชั้น', 0, hr - 1))
    };
    for (var c = 0; c <= b.e.c; c++) {
      if (norm(cell(ws, hr + 2, c)) === 'เก็บ' && norm(cell(ws, hr + 2, c + 1)) === 'สอบ') {
        var name = cell(ws, hr, c), code = cell(ws, hr + 1, c);
        if (!name || name === 0 || !code || code === 0) continue;
        out.subjects.push({ name: str(name), code: str(code).replace(/\s+/g, ''), col: c });
      }
    }
    rows(ws, hr + 2, 3).forEach(function (s) {
      var sc = {};
      out.subjects.forEach(function (sub) {
        var a = num(cell(ws, s.r, sub.col)), e = num(cell(ws, s.r, sub.col + 1)), t = num(cell(ws, s.r, sub.col + 2));
        if (t == null && a != null && e != null) t = a + e;
        sc[sub.code] = (a == null && e == null && t == null) ? null : { collect: a, exam: e, total: t };
      });
      out.byNo[s.no] = sc;
      out.students.push({
        no: s.no, id: str(cell(ws, s.r, 1)), prefix: str(cell(ws, s.r, 2)),
        first: str(cell(ws, s.r, 3)), last: str(cell(ws, s.r, 4))
      });
    });
    return out;
  }

  // ---------- หน่วยกิตจากชีตข้อมูลทั้งหมด ----------
  function parseCredits(ws, level) {
    var out = {};
    if (!ws) return out;
    var b = bounds(ws), tables = [];
    for (var r = 0; r <= Math.min(b.e.r, 120); r++) for (var c = 0; c <= b.e.c; c++) {
      var v = norm(cell(ws, r, c));
      var m = v.match(/^ตารางคิดหน่วยกิต.*?(\d)-(\d)$/);
      if (m) tables.push({ r: r, c: c, lo: +m[1], hi: +m[2] });
    }
    var t = tables.filter(function (x) { return level >= x.lo && level <= x.hi; })[0] || tables[0];
    if (!t) return out;
    var hdr = find(ws, eq('วิชา'), t.r, t.r + 3, t.c, t.c + 1);
    var r0 = hdr ? hdr.r + 1 : t.r + 2;
    for (var r2 = r0; r2 <= r0 + 30; r2++) {
      var name = cell(ws, r2, t.c);
      if (!name) continue;
      if (norm(name) === 'รวม') break;
      out[norm(name)] = { hours: num(cell(ws, r2, t.c + 1)), credit: num(cell(ws, r2, t.c + 2)) };
    }
    return out;
  }

  // ---------- เวลาเรียน ----------
  function parseAttendance(ws) {
    var out = {};
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r;
    var g = {
      t1: find(ws, eq('ภาคเรียนที่ 1'), hr, hr), t2: find(ws, eq('ภาคเรียนที่ 2'), hr, hr),
      year: find(ws, starts('สรุปเวลาเรียน'), hr, hr)
    };
    var pct = find(ws, starts('คิดเป็นร้อยละ'), hr + 1, hr + 1);
    rows(ws, hr + 1, 3).forEach(function (s) {
      var a = {};
      for (var k in g) if (g[k]) a[k] = { total: num(cell(ws, s.r, g[k].c)), present: num(cell(ws, s.r, g[k].c + 1)) };
      if (a.year) {
        a.year.pct = pct ? num(cell(ws, s.r, pct.c)) : null;
        if (a.year.pct == null && a.year.total) a.year.pct = round(a.year.present / a.year.total * 100, 2);
      }
      out[s.no] = a;
    });
    return out;
  }

  // ---------- สุขภาพและพฤติกรรม ----------
  function parseHealth(ws) {
    var out = {};
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r;
    var t1 = find(ws, eq('ภาคเรียนที่ 1'), hr, hr), t2 = find(ws, eq('ภาคเรียนที่ 2'), hr, hr);
    var beh = find(ws, starts('พฤติกรรม'), hr, hr);
    rows(ws, hr + 1, 3).forEach(function (s) {
      out[s.no] = {
        t1: t1 ? { w: num(cell(ws, s.r, t1.c)), h: num(cell(ws, s.r, t1.c + 1)) } : {},
        t2: t2 ? { w: num(cell(ws, s.r, t2.c)), h: num(cell(ws, s.r, t2.c + 1)) } : {},
        behavior: beh ? str(cell(ws, s.r, beh.c)) : ''
      };
    });
    return out;
  }

  // ---------- อ่าน คิดวิเคราะห์ เขียน ----------
  function parseRTW(ws) {
    var out = { items: [], byNo: {} };
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r;
    var ind = find(ws, eq('ตัวชี้วัด'), hr, hr);
    var tot = find(ws, eq('รวม'), hr, hr), res = find(ws, eq('ผลการประเมิน'), hr, hr);
    if (ind && tot) {
      for (var c = ind.c; c < tot.c; c++) {
        var name = cell(ws, hr + 1, c);
        if (!name) continue;
        var mx = null;
        for (var r = hr + 1; r <= hr + 6; r++) { var m = norm(cell(ws, r, c)).match(/^(\d+)คะแนน$/); if (m) { mx = +m[1]; break; } }
        out.items.push({ name: str(name), max: mx, col: c });
      }
    }
    var label = ['การอ่าน', 'คิดวิเคราะห์', 'การเขียน'];
    out.items.forEach(function (it, i) { it.short = label[i] || it.name; });
    rows(ws, hr + 1, 2).forEach(function (s) {
      var scores = out.items.map(function (it) { return num(cell(ws, s.r, it.col)); });
      var total = tot ? num(cell(ws, s.r, tot.c)) : null;
      if (total == null && scores.every(function (x) { return x != null; })) total = scores.reduce(function (a, b) { return a + b; }, 0);
      out.byNo[s.no] = { scores: scores, total: total, result: res ? str(cell(ws, s.r, res.c)) : '' };
    });
    out.items.forEach(function (it) { delete it.col; });
    return out;
  }

  // ---------- คุณลักษณะอันพึงประสงค์ ----------
  function parseCharacteristics(ws) {
    var out = { items: [], byNo: {} };
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r;
    var sum = find(ws, eq('สรุป'), hr, hr, 0, 20);
    var start = find(ws, starts('คุณลักษณะ'), hr, hr, 0, 20);
    var cols = [];
    if (start) for (var c = start.c; c < (sum ? sum.c : start.c + 8); c++) {
      var name = cell(ws, hr + 1, c);
      if (name) { cols.push(c); out.items.push(str(name).replace(/^ข้อ\s*\d+\s*/, '')); }
    }
    rows(ws, hr + 1, 2).forEach(function (s) {
      out.byNo[s.no] = {
        items: cols.map(function (c) { return str(cell(ws, s.r, c)); }),
        summary: sum ? str(cell(ws, s.r, sum.c)) : ''
      };
    });
    return out;
  }

  // ---------- สมรรถนะของผู้เรียน ----------
  function parseCompetencies(ws) {
    var out = { groups: [], byNo: {} };
    if (!ws) return out;
    var h = header(ws);
    if (!h) return out;
    var hr = h.r;
    var heads = [];
    for (var c = 3; c <= 30; c++) {
      var v = cell(ws, hr, c);
      if (v && /^ความสามารถ/.test(norm(v))) heads.push({ c: c, name: str(v) });
    }
    heads.forEach(function (g, i) {
      var end = i + 1 < heads.length ? heads[i + 1].c - 1 : g.c + 6;
      var items = [];
      for (var c = g.c; c <= end; c++) {
        var n = cell(ws, hr + 1, c);
        if (!n) { if (i + 1 >= heads.length) break; continue; } // กลุ่มสุดท้าย: หยุดเมื่อเจอช่องว่าง
        items.push({ name: str(n), col: c });
      }
      out.groups.push({ name: g.name, items: items });
    });
    rows(ws, hr + 1, 2).forEach(function (s) {
      out.byNo[s.no] = out.groups.map(function (g) { return g.items.map(function (it) { return str(cell(ws, s.r, it.col)); }); });
    });
    out.groups.forEach(function (g) { g.items = g.items.map(function (it) { return it.name; }); });
    return out;
  }

  // ---------- ใบรายงาน: ผู้ลงนาม ตารางตัวชี้วัด ข้อความสาเหตุ ----------
  function parseReportSheet(ws) {
    var out = { signers: [], indicators: {}, reason: '', nameCells: [] };
    if (!ws) return out;
    var b = bounds(ws);
    for (var r = 0; r <= b.e.r; r++) for (var c = 0; c <= b.e.c; c++) {
      var v = cell(ws, r, c);
      if (typeof v !== 'string') continue;
      var m = v.match(/^\((.+)\)$/);
      if (m) {
        var name = str(m[1]), pos = '';
        for (var k = 0; k <= 2 && !pos; k++) { var p = str(cell(ws, r + 1, c + k)); if (/^ตำแหน่ง/.test(p)) pos = p.replace(/^ตำแหน่ง\s*/, ''); }
        out.nameCells.push({ r: r, c: c, name: name, position: pos });
        if (!out.signers.some(function (s) { return s.name === name && s.position === pos; })) out.signers.push({ name: name, position: pos });
      }
      if (!out.reason && /^เป็นผู้ที่ผ่านเกณฑ์/.test(v)) out.reason = v;
    }
    var hd = find(ws, eq('ตัวชี้วัดทั้งหมด'));
    if (hd) {
      var nameCol = find(ws, starts('กลุ่มสาระ'), hd.r, hd.r, 0, hd.c);
      for (var r2 = hd.r + 1; r2 <= hd.r + 20; r2++) {
        var n = cell(ws, r2, nameCol ? nameCol.c : hd.c - 2);
        if (!n || /^รวม/.test(norm(n))) break;
        out.indicators[norm(n)] = { total: num(cell(ws, r2, hd.c)), passed: num(cell(ws, r2, hd.c + 1)) };
      }
    }
    return out;
  }

  // ---------- รูปภาพในชีตใบรายงาน (โลโก้ / ลายเซ็น) ----------
  function zfind(zip, path) { return XLSX.CFB.find(zip, '/' + path.replace(/^\/+/, '')); }
  function zipText(zip, path) {
    var f = zfind(zip, path);
    if (!f || !f.content) return null;
    var u = f.content instanceof Uint8Array ? f.content : new Uint8Array(f.content);
    if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8').decode(u);
    return Buffer.from(u).toString('utf8');
  }
  function zipBytes(zip, path) {
    var f = zfind(zip, path);
    if (!f || !f.content) return null;
    return f.content instanceof Uint8Array ? f.content : new Uint8Array(f.content);
  }
  function rels(xml) {
    var out = {}, re = /<Relationship\b[^>]*>/g, m;
    while ((m = re.exec(xml || ''))) {
      var id = (m[0].match(/\bId="([^"]+)"/) || [])[1], t = (m[0].match(/\bTarget="([^"]+)"/) || [])[1];
      if (id && t) out[id] = t;
    }
    return out;
  }
  function resolve(base, target) {
    if (target.charAt(0) === '/') return target.slice(1);
    var parts = base.split('/'); parts.pop();
    target.split('/').forEach(function (p) { if (p === '..') parts.pop(); else if (p !== '.') parts.push(p); });
    return parts.join('/');
  }
  function toDataURL(bytes, path) {
    var ext = (path.match(/\.(\w+)$/) || [])[1] || 'png';
    var mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', bmp: 'image/bmp' }[ext.toLowerCase()] || 'image/png';
    var bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    var b64 = typeof btoa !== 'undefined' ? btoa(bin) : Buffer.from(bin, 'binary').toString('base64');
    return 'data:' + mime + ';base64,' + b64;
  }
  function extractImages(buf, sheetName, nameCells, roleOf) {
    var res = { roles: {}, all: [] };
    try {
      var zip = XLSX.CFB.read(buf, { type: 'array' });
      var wbXml = zipText(zip, 'xl/workbook.xml');
      var wbRels = rels(zipText(zip, 'xl/_rels/workbook.xml.rels'));
      var re = /<sheet\b[^>]*>/g, m, sheetPath = null;
      while ((m = re.exec(wbXml || ''))) {
        var nm = (m[0].match(/\bname="([^"]+)"/) || [])[1] || '';
        nm = nm.replace(/&amp;/g, '&');
        var rid = (m[0].match(/\br:id="([^"]+)"/) || [])[1];
        if (norm(nm) === norm(sheetName) && wbRels[rid]) sheetPath = resolve('xl/workbook.xml', wbRels[rid]);
      }
      if (!sheetPath) return res;
      var sRelsPath = sheetPath.replace(/([^/]+)$/, '_rels/$1.rels');
      var sRels = rels(zipText(zip, sRelsPath));
      var drawingPath = null;
      for (var k in sRels) if (/drawings\//.test(sRels[k])) drawingPath = resolve(sheetPath, sRels[k]);
      if (!drawingPath) return res;
      var dXml = zipText(zip, drawingPath) || '';
      var dRels = rels(zipText(zip, drawingPath.replace(/([^/]+)$/, '_rels/$1.rels')));
      var anchors = dXml.split(/<xdr:(?:twoCellAnchor|oneCellAnchor|absoluteAnchor)\b/).slice(1);
      var seen = {};
      anchors.forEach(function (a) {
        var col = +((a.match(/<xdr:from>\s*<xdr:col>(\d+)<\/xdr:col>/) || [])[1] || 0);
        var row = +((a.match(/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/) || [])[1] || 0);
        var emb = (a.match(/r:embed="([^"]+)"/) || [])[1];
        if (!emb || !dRels[emb]) return;
        var path = resolve(drawingPath, dRels[emb]);
        var bytes = zipBytes(zip, path);
        if (!bytes) return;
        if (!seen[path]) { seen[path] = toDataURL(bytes, path); res.all.push(seen[path]); }
        var url = seen[path];
        var role = null;
        if (row <= 1 && col <= 4) role = 'logo';
        else {
          var best = null, bd = 1e9;
          nameCells.forEach(function (nc) {
            var dr = nc.r - row;
            if (dr < -1 || dr > 6) return;
            var d = Math.abs(dr) + Math.abs(nc.c - col) * 0.6;
            if (d < bd) { bd = d; best = nc; }
          });
          if (best) role = roleOf(best);
        }
        if (role && !res.roles[role]) res.roles[role] = url;
      });
    } catch (e) {
      if (typeof console !== 'undefined') console.warn('extractImages', e);
    }
    return res;
  }

  function isPP6(wb) {
    return !!(sheet(wb, 'ผลสัมฤทธิ์ฯ เทอม 1') && (sheet(wb, REPORT_SHEET) || sheet(wb, 'บันทึกเวลาเรียน')));
  }

  function parse(wb, buf) {
    var t1 = parseTerm(sheet(wb, 'ผลสัมฤทธิ์ฯ เทอม 1'));
    if (!t1.students.length) throw new Error('ไม่พบรายชื่อนักเรียนในชีต "ผลสัมฤทธิ์ฯ เทอม 1"');
    var t2 = parseTerm(sheet(wb, 'ผลสัมฤทธิ์ฯ เทอม 2'));
    var attWs = sheet(wb, 'บันทึกเวลาเรียน');
    var info = t1.info;
    var className = info.className || str(after(attWs, 'ชั้น', 0, 1));
    var year = info.year || num(after(attWs, 'ปีการศึกษา', 0, 1));
    var stage = /มัธยม/.test(className) ? 'ม' : 'ป';
    var lm = className.match(/(\d+)\s*\/\s*(\d+)/) || className.match(/(\d+)/);
    var level = lm ? +lm[1] : null, room = lm && lm[2] ? +lm[2] : 1;
    if (!level) throw new Error('ไม่พบชั้นเรียน (เช่น "ประถมศึกษาปีที่ 4/2") ในชีตผลสัมฤทธิ์');

    var credits = parseCredits(sheet(wb, 'ข้อมูลทั้งหมด'), level);
    var subjects = t1.subjects.map(function (s) {
      var cr = credits[norm(s.name)] || {};
      var m = s.code.match(/^[ก-ฮ]\d(\d)(\d)/);
      return { code: s.code, name: s.name, credit: cr.credit != null ? cr.credit : null, hours: cr.hours || null, basic: m ? m[2] === '1' && +m[1] === level : true };
    });

    var rep = parseReportSheet(sheet(wb, REPORT_SHEET));
    var teacherName = info.teacher || '';
    function roleOf(s) {
      var p = s.position || '';
      if (/รองผู้อำนวยการ/.test(p)) return 'deputy';
      if (/ผู้อำนวยการ/.test(p)) return 'director';
      if (/ครู/.test(p) || norm(s.name) === norm(teacherName)) return 'teacher';
      return null;
    }
    var signers = { teacher: { name: teacherName, position: 'ครูประจำชั้น' }, deputy: null, director: null };
    rep.signers.forEach(function (s) { var r = roleOf(s); if (r && r !== 'teacher' && !signers[r]) signers[r] = s; });
    var school = '';
    [signers.director, signers.deputy].forEach(function (s) {
      var m = s && s.position.match(/(โรงเรียน.+)$/);
      if (!school && m) school = m[1];
    });

    var images = buf ? extractImages(buf, REPORT_SHEET, rep.nameCells, roleOf) : { roles: {}, all: [] };
    var att = parseAttendance(attWs);
    var health = parseHealth(sheet(wb, 'บันทึกสุขภาพและพฤติกรรมนักเรียน'));
    var rtw = parseRTW(sheet(wb, 'การคิดวิเคราะห์และเขียน'));
    var chars = parseCharacteristics(sheet(wb, 'คุณลักษณะอันพึงประสงค์'));
    var comp = parseCompetencies(sheet(wb, 'สมรรถนะของผู้เรียน'));

    var students = t1.students.map(function (s) {
      var name = (s.prefix + s.first + ' ' + s.last).trim();
      return {
        no: s.no, id: s.id, prefix: s.prefix, first: s.first, last: s.last, name: name,
        t1: t1.byNo[s.no] || {}, t2: t2.byNo[s.no] || {},
        attendance: att[s.no] || null, health: health[s.no] || null,
        rtw: rtw.byNo[s.no] || null, characteristics: chars.byNo[s.no] || null,
        competencies: comp.byNo[s.no] || null
      };
    });

    return {
      format: 'pp6', version: 1,
      meta: {
        year: year, className: className, stage: stage, level: level, room: room,
        levelName: stage + '.' + level, teacher: teacherName, school: school,
        signers: signers, reason: rep.reason, termMax: 50
      },
      subjects: subjects,
      indicatorTable: rep.indicators,
      rtwItems: rtw.items,
      characteristicItems: chars.items,
      competencyGroups: comp.groups,
      images: images.roles,
      allImages: images.all,
      students: students
    };
  }

  function parseArrayBuffer(buf) {
    var u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    var wb = XLSX.read(u8, { type: 'array', cellFormula: false, cellHTML: false, cellStyles: false, bookVBA: false });
    return parse(wb, u8);
  }

  return { isPP6: isPP6, parse: parse, parseArrayBuffer: parseArrayBuffer };
});

</script>
<script>
/* ใบรายงานผลการเรียนรายบุคคล (ปพ.6): แสดงตัวอย่าง พิมพ์ และดาวน์โหลด PDF (รวม / แยกรายคน, A4 / ครึ่ง A4) */
(function () {
  'use strict';

  var CHAR_PASS = ['ดีเยี่ยม', 'ดี', 'ผ่าน'];
  var LIBS = window.PP5_LIBS || ['vendor/html2canvas.min.js', 'vendor/jspdf.umd.min.js', 'vendor/jszip.min.js'];
  var ctx = null;     // ตัวช่วยจาก app.js
  var busyRun = false;

  function esc(v) { return ctx.esc(v); }
  function dash(v, d) {
    if (v == null || v === '') return '–';
    if (typeof v === 'number') return d != null ? v.toFixed(d) : String(Math.round(v * 100) / 100);
    return esc(v);
  }
  function norm(s) { return String(s || '').replace(/\s+/g, ''); }

  // ---------- การคำนวณ (สูตรเดียวกับไฟล์ ปพ.6) ----------
  function gradeOf(pct) {
    if (pct == null) return null;
    if (pct >= 80) return 4; if (pct >= 75) return 3.5; if (pct >= 70) return 3; if (pct >= 65) return 2.5;
    if (pct >= 60) return 2; if (pct >= 55) return 1.5; if (pct >= 50) return 1; return 0;
  }
  function bmiText(b) {
    if (b == null) return '';
    if (b >= 30) return 'โรคอ้วนระดับที่ 2'; if (b >= 25) return 'โรคอ้วนระดับที่ 1'; if (b >= 23) return 'น้ำหนักเกิน';
    if (b >= 18.5) return 'อยู่ในเกณฑ์ปกติ'; return 'น้ำหนักน้อยหรือผอม';
  }
  function bmi(w, h) { return w && h ? w / Math.pow(h / 100, 2) : null; }

  function defaults(d) {
    var s = d.meta.signers || {};
    var hasT2 = d.students.some(function (st) { return Object.keys(st.t2 || {}).some(function (k) { return st.t2[k]; }); });
    return {
      paper: 'a4', showLogo: true, showSign: true, gradeMode: hasT2 ? 'year' : 'term1',
      school: d.meta.school || '',
      teacher: { name: (s.teacher && s.teacher.name) || d.meta.teacher || '', position: 'ครูประจำชั้น', img: 'teacher' },
      deputy: { name: (s.deputy && s.deputy.name) || '', position: (s.deputy && s.deputy.position) || 'รองผู้อำนวยการโรงเรียน', img: 'deputy' },
      director: { name: (s.director && s.director.name) || '', position: (s.director && s.director.position) || 'ผู้อำนวยการโรงเรียน', img: 'director' },
      logo: 'logo'
    };
  }
  function settingsOf(rec) {
    var def = defaults(rec.data), s = rec.settings || {};
    var out = Object.assign({}, def, s);
    ['teacher', 'deputy', 'director'].forEach(function (k) { out[k] = Object.assign({}, def[k], s[k] || {}); });
    return out;
  }
  function imgOf(rec, key) {
    if (!key) return null;
    var d = rec.data;
    if (/^#\d+$/.test(key)) return d.allImages[+key.slice(1)] || null;
    return d.images[key] || null;
  }

  // ข้อมูลตัวชี้วัด/กิจกรรมจากไฟล์ ปพ.5 ของห้องเดียวกัน (ถ้าอัปโหลดไว้)
  function pp5Lookup() {
    var map = {};
    ctx.classRecords().forEach(function (r) {
      var code = r.data.meta.code;
      r.data.students.forEach(function (s) {
        var k = s.id ? 'id:' + s.id : 'nm:' + norm(s.name);
        (map[k] = map[k] || {})[code] = s;
      });
    });
    return map;
  }

  function computeAll(rec, st) {
    var d = rec.data, max = d.meta.termMax || 50, lookup = pp5Lookup();
    var list = d.students.map(function (s) {
      var p5 = lookup['id:' + s.id] || lookup['nm:' + norm(s.name)] || {};
      var rows = d.subjects.map(function (sub) {
        var a = s.t1[sub.code], b = s.t2[sub.code];
        var t1 = a ? a.total : null, t2 = b ? b.total : null, total = null, pct = null, basis = '';
        if (t1 != null && t2 != null) { total = t1 + t2; pct = total; basis = 'year'; }
        else if (t1 != null && st.gradeMode === 'term1') { pct = t1 / max * 100; basis = 'term1'; }
        var g = gradeOf(pct);
        var pr = p5[sub.code];
        if (pr && pr.result && pr.result.rms) g = pr.result.rms; // ร / มส จาก ปพ.5
        return { sub: sub, t1: t1, t2: t2, total: total, pct: pct, grade: g, basis: basis };
      });
      var cr = 0, gp = 0, pp = 0, complete = true;
      rows.forEach(function (r) {
        if (typeof r.grade !== 'number' || !r.sub.credit) { if (r.sub.credit) complete = false; return; }
        cr += r.sub.credit; gp += r.grade * r.sub.credit; pp += r.pct * r.sub.credit;
      });
      var gpa = cr ? gp / cr : null, pct = cr ? pp / cr : null;

      var att = s.attendance && s.attendance.year, attPct = att ? att.pct : null;
      var ind = Object.keys(d.indicatorTable).map(function (name) {
        var base = d.indicatorTable[name];
        var sub = d.subjects.filter(function (x) { return norm(x.name) === name; })[0];
        var pr = sub && p5[sub.code];
        if (pr && pr.indSummary && pr.indSummary.pass != null) {
          var tot = (pr.indSummary.pass || 0) + (pr.indSummary.fail || 0);
          return { name: sub ? sub.name : name, total: tot, passed: pr.indSummary.pass, src: 'pp5' };
        }
        return { name: sub ? sub.name : name, total: base.total, passed: base.passed, src: 'pp6' };
      });
      var indTot = ind.reduce(function (a, x) { return a + (x.total || 0); }, 0);
      var indPassed = ind.reduce(function (a, x) { return a + (x.passed || 0); }, 0);

      var act = null;
      Object.keys(p5).some(function (k) { var a = p5[k].activities; if (a && (a.guidance || a.scout)) { act = a; return true; } return false; });
      var actDefault = attPct == null ? '' : attPct >= 80 ? 'ผ่าน' : 'ไม่ผ่าน';
      function actText(v) { return !v ? actDefault : /^ผ/.test(v) ? 'ผ่าน' : /^มผ/.test(v) ? 'ไม่ผ่าน' : v; }
      var acts = [
        ['กิจกรรมแนะแนว', actText(act && act.guidance)],
        ['กิจกรรมลูกเสือ - เนตรนารี', actText(act && act.scout)],
        ['กิจกรรมชุมนุม' + (act && act.clubName ? ' (' + act.clubName + ')' : ''), actText(act && act.club)],
        ['กิจกรรมเพื่อสังคมและสาธารณประโยชน์', actText(act && act.social)]
      ];

      var gradesKnown = rows.every(function (r) { return r.grade != null; });
      var minPass = gradesKnown ? rows.every(function (r) { return typeof r.grade === 'number' && r.grade >= 1; }) : null;
      var res = {
        att: attPct == null ? null : attPct >= 80,
        ind: indTot ? indPassed >= indTot : null,
        grade: minPass,
        rtw: s.rtw && s.rtw.result ? s.rtw.result !== 'ไม่ผ่าน' : null,
        chars: s.characteristics && s.characteristics.summary ? CHAR_PASS.indexOf(s.characteristics.summary) >= 0 : null,
        acts: acts.every(function (a) { return a[1] === 'ผ่าน'; }) ? true : acts.some(function (a) { return a[1] === 'ไม่ผ่าน'; }) ? false : null
      };
      var vals = Object.keys(res).map(function (k) { return res[k]; });
      var promote = vals.indexOf(false) >= 0 ? false : vals.indexOf(null) >= 0 ? null : true;
      // ยังไม่มีคะแนนภาค 2: ยังไม่ตัดสินเลื่อนชั้น
      if (rows.some(function (r) { return r.basis === 'term1'; })) promote = null;

      return {
        s: s, rows: rows, gpa: gpa, pct: pct, complete: complete, attPct: attPct, att: att,
        ind: ind, indTot: indTot, indPassed: indPassed, acts: acts, res: res, promote: promote
      };
    });
    // อันดับตามเกรดเฉลี่ย (แบบ RANK ของ Excel)
    list.forEach(function (x) {
      x.rank = x.gpa == null ? null : 1 + list.filter(function (y) { return y.gpa != null && Math.round(y.gpa * 1e6) > Math.round(x.gpa * 1e6); }).length;
    });
    list.count = list.filter(function (x) { return x.gpa != null; }).length;
    return list;
  }

      '<tr><td colspan="' + (d.rtwItems.length + 1) + '">ผลการประเมิน: <b>' + dash(r.result) + '</b></td></tr></tbody></table></div></div>';
    h += '<div class="rc-foot">หน้า 1</div></div>';

  var libsReady = null;
  function loadLibs() {
    if (libsReady) return libsReady;
    libsReady = LIBS.reduce(function (p, src) {
      return p.then(function () {
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = src; s.onload = res; s.onerror = function () { rej(new Error('โหลด ' + src + ' ไม่สำเร็จ')); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve());
    libsReady.catch(function () { libsReady = null; });
    return libsReady;
  }
